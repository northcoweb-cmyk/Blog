name: Live news health check

on:
  schedule:
    - cron: '17 11 * * *' # every morning, after the site's daily job
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'dev/check-live.js'
      - '.github/workflows/health.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node dev/check-live.js
