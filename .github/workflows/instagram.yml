name: Instagram autopilot

# Vercel's free plan only runs its own timer once a day, so GitHub calls the
# site every hour instead. The site decides whether it's time to post.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://tensorstreet.com
#   CRON_SECRET  the same value as CRON_SECRET in Vercel

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run autopilot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set yet: skipping."; exit 0
          fi
          curl -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/instagram"
          echo
