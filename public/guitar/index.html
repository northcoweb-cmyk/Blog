function CameraSetup(root, { onPass, needBoth = false }) {
  root.innerHTML = `<div class="stack">
    <p class="big">${needBoth ? 'Sit with your guitar like you are about to play.' : 'The camera watches your hands to catch flat fingers and check your strumming direction.'}</p>
    <div class="tip"><div class="ico">💡</div><div class="grow"><p><b>Set it up like this:</b> laptop about an arm's length away, camera at chest height, a lamp or window <b>in front of</b> you (not behind). Both hands and the guitar neck should be in the picture. A basic webcam is fine.</p></div></div>
    <div><button class="btn primary big" data-go>📷 Turn on camera</button></div>
    <div class="feedback" data-fb>${Camera.active ? 'Camera is on. Look at the panel in the bottom-right corner.' : ''}</div>
    <p class="small dim">The video never leaves your computer. Hand tracking runs right in your browser.</p></div>`;
  const fb = $('[data-fb]', root);
  let seenSince = 0;
  const offs = [
    Camera.on('frame', () => {
      const fret = Camera.seen('fret', 400), strum = Camera.seen('strum', 400);
      const good = needBoth ? fret && strum : fret || strum;
      if (!good) {
        seenSince = 0;
        fb.className = 'feedback warn';
        fb.innerHTML = needBoth
          ? `<b>${fret ? "I see your fretting hand, but not your strumming hand." : strum ? "I see your strumming hand, but not your fretting hand." : "I can't see your hands yet."}</b> Shift until both hands are in the picture. The labels in the camera panel show which is which. If they're backwards, press ⇄ in the panel.`
          : '<b>Looking for your hands…</b> Hold them up where the camera can see them.';
        return;
      }
      if (!seenSince) seenSince = performance.now();
      if (performance.now() - seenSince > 1500) {
        fb.className = 'feedback ok';
        fb.innerHTML = needBoth ? '<b>Got both hands ✓</b> Keep this position when you practice.' : '<b>I can see you ✓</b> Hand tracking works.';
        onPass?.();
      }
    }),
    Camera.on('state', () => {
      if (Camera.error) { fb.className = 'feedback bad'; fb.textContent = Camera.error; }
      else if (Camera.loading) { fb.className = 'feedback'; fb.textContent = 'Starting camera and loading hand tracking…'; }
    }),
  ];
  const btn = $('[data-go]', root);
  if (Camera.active) btn.classList.add('hidden');
  btn.onclick = async () => { if (await Camera.start(Store.data.settings.camId)) btn.classList.add('hidden'); };
  return () => offs.forEach((f) => f());
}

// ---------- Tuner ----------
function Tuner(root, { onPass, requireAll = false } = {}) {
  return needMic(root, () => {
    const done = new Set();
    let target = 6, manual = false, readings = [], inTune = 0, alive = true;
    const names = { 6: 'E', 5: 'A', 4: 'D', 3: 'G', 2: 'B', 1: 'e' };
    root.innerHTML = `<div class="card flat tuner">
      <div class="tune-strings">${[6, 5, 4, 3, 2, 1].map((s) => `<button data-s="${s}">${names[s]}<small>string ${s}</small></button>`).join('')}</div>
      <div style="height:18px"></div>
      <div class="note" data-note>–</div>
      <div class="cents" data-cents>Pluck ${stringLabel(target)}</div>
      <div class="gauge"><div class="scale"></div><div class="zero"></div><div class="needle" data-needle></div></div>
      <div class="feedback center" data-fb>Pluck one string and let it ring.</div>
      ${requireAll ? '<div style="margin-top:12px"><button class="btn small" data-tuned>My guitar is already tuned →</button></div>' : ''}
      <p class="small dim" style="margin-top:12px">Tip: tune <b>up</b> to the note. If you're too high, loosen below it and come back up; strings hold their tuning better that way.</p>
    </div>`;
    const paint = () => $$('[data-s]', root).forEach((b) => {
      const s = +b.dataset.s;
      b.classList.toggle('cur', s === target);
      b.classList.toggle('done', done.has(s));
    });
    paint();
    $$('[data-s]', root).forEach((b) => (b.onclick = () => { target = +b.dataset.s; manual = true; inTune = 0; readings = []; paint(); }));
    const fb = $('[data-fb]', root), needle = $('[data-needle]', root);
    const tunedBtn = $('[data-tuned]', root);
    if (tunedBtn) tunedBtn.onclick = () => { Store.set((d) => (d.tunedOn = Store.today())); fb.className = 'feedback ok'; fb.innerHTML = '<b>Got it ✓</b> Skipping the tuner.'; onPass?.(); };
    const iv = setInterval(() => {
      if (!alive) return;
      if (Mic.level < 0.003) { readings = []; inTune = 0; return; }
      const r = DSP.yin(Mic.latest(4096), Mic.sr, 70, 700);
      if (!r || r.clarity < 0.85) return;
      readings.push(r.midi);
      if (readings.length > 5) readings.shift();
      const midi = readings.slice().sort((a, b) => a - b)[readings.length >> 1];
      if (!manual && !requireAll) {
        // Free mode: follow whichever string is closest.
        target = [6, 5, 4, 3, 2, 1].reduce((best, s) => (Math.abs(midi - openMidi(s)) < Math.abs(midi - openMidi(best)) ? s : best), 6);
        paint();
      }
      const want = openMidi(target);
      // Allow octave confusion (laptop mics often hear the low strings an octave up).
      let cents = (midi - want) * 100;
      for (const o of [-1200, 1200]) if (Math.abs(cents + o) < Math.abs(cents)) cents += o;
      $('[data-note]', root).textContent = DSP.noteName(midi);
      $('[data-cents]', root).textContent = `${cents > 0 ? '+' : ''}${cents.toFixed(0)} cents · target ${names[target]} (${stringLabel(target)})`;
      needle.style.left = 50 + Math.max(-50, Math.min(50, cents)) + '%';
      const ok = Math.abs(cents) <= 7;
      needle.classList.toggle('in', ok);
      if (Math.abs(cents) > 300) {
        fb.className = 'feedback warn';
        fb.innerHTML = `<b>That's ${DSP.noteName(midi)}, way off from ${names[target]}.</b> Are you plucking ${stringLabel(target)}? If yes, turn its peg slowly ${cents < 0 ? 'to tighten (raise the pitch)' : 'to loosen (lower the pitch)'}.`;
      } else if (ok) {
        fb.className = 'feedback ok';
        fb.innerHTML = '<b>In tune ✓</b> Hold it…';
      } else {
        fb.className = 'feedback';
        fb.innerHTML = cents < 0 ? '<b>Too low ↑</b> Tighten the peg a little (tune up).' : '<b>Too high ↓</b> Loosen the peg a little (tune down).';
      }
      inTune = ok ? inTune + 1 : 0;
      if (inTune === 10 && !done.has(target)) {
        done.add(target);
        toast(`String ${target} (${STRING_NAMES[target]}) is in tune ✓`);
        if (done.size === 6 || (!requireAll && done.size >= 1)) Store.set((d) => (d.tunedOn = Store.today()));
        if (requireAll) {
          const nextS = [6, 5, 4, 3, 2, 1].find((s) => !done.has(s));
          if (nextS) { target = nextS; manual = true; readings = []; inTune = 0; $('[data-cents]', root).textContent = `Now pluck ${stringLabel(target)}`; }
          else { fb.className = 'feedback ok'; fb.innerHTML = '<b>All six strings are in tune! ✓</b>'; onPass?.(); }
        }
        paint();
      }
    }, 50);
    if (requireAll) manual = true;
    return () => { alive = false; clearInterval(iv); };
  });
}

// ---------- String-by-string check ----------
function StringCheck(root, { chord, onPass, onStat }) {
  return needMic(root, () => {
    const strings = chord.frets.map((f, i) => ({ s: 6 - i, f })).filter((x) => x.f >= 0);
    const skipped = chord.frets.map((f, i) => ({ s: 6 - i, f })).filter((x) => x.f < 0).map((x) => x.s);
    const state = {};
    let cur = 0, busy = false, alive = true;
    const isOpen = chord.id === 'open';
    root.innerHTML = `<div class="ex">
      <div data-diag></div>
      <div class="stack">
        <div><div class="prompt" data-prompt></div><div class="muted" data-sub></div></div>
        <div class="feedback" data-fb>${listenBadge()}</div>
        <div class="string-list" data-list></div>
        <div class="row"><button class="btn small ghost" data-skip>Skip this string</button><button class="btn small ghost" data-restart>Start over</button></div>
        ${skipped.length ? `<p class="small muted">Don't play ${skipped.map((s) => `string ${s}`).join(' or ')} on this chord.</p>` : ''}
      </div></div>`;
    const render = () => {
      const status = {};
      strings.forEach((x, i) => (status[x.s] = state[x.s]?.ok ? 'ok' : state[x.s] ? 'bad' : i === cur ? 'cur' : undefined));
      $('[data-diag]', root).innerHTML = isOpen
        ? `<div class="diagram-wrap"><div class="label">E A D G B E</div>${chordSVG(chord, { status, w: 200 })}</div>`
        : diagramBlock(chord, { status, w: 220 });
      const x = strings[cur];
      if (x) {
        const fg = chord.fingers?.[6 - x.s];
        $('[data-prompt]', root).textContent = `Pluck ${stringLabel(x.s)}`;
        $('[data-sub]', root).innerHTML = x.f === 0
          ? `Open string, no finger on it. Should sound <b>${DSP.noteName(openMidi(x.s))}</b>.`
          : `Fret ${x.f} with your ${fingerName(fg)} finger. Should sound <b>${DSP.noteName(openMidi(x.s) + x.f)}</b>.`;
      } else {
        $('[data-prompt]', root).textContent = 'All strings checked';
        $('[data-sub]', root).textContent = '';
      }
      $('[data-list]', root).innerHTML = strings.map((y, i) => {
        const st = state[y.s];
        const cls = st?.ok ? 'ok' : st ? 'bad' : i === cur ? 'cur' : '';
        return `<div class="string-row ${cls}"><span class="n">${y.s}</span><span class="what">${esc(STRING_NAMES[y.s])} ${y.f ? `· fret ${y.f}` : '· open'}</span><span class="res">${st ? (st.ok ? 'clean' : esc(st.short)) : i === cur ? 'now' : ''}</span></div>`;
      }).join('');
    };
    render();
    const fb = $('[data-fb]', root);
    const advance = () => {
      cur = strings.findIndex((x) => !state[x.s]?.ok);
      if (cur < 0) {
        cur = strings.length;
        render();
        fb.className = 'feedback ok';
        fb.innerHTML = `<b>Every string rings clean! ✓</b> ${isOpen ? '' : 'Your fingers are in the right spots.'}`;
        Store.set((d) => { if (!isOpen) Store.chord(chord.id).strings++; });
        onPass?.();
        return;
      }
      render();
    };
    const offs = [animateListen(root), Mic.on('onset', async (o) => {
      if (busy || cur >= strings.length) return;
      busy = true;
      const x = strings[cur];
      const pre = Mic.read(o.abs - 16384 - Math.round(0.015 * Mic.sr), 16384);
      const post = await Mic.capture(o.abs, 0.02, 16384);
      if (!alive) return;
      const r = DSP.checkString(post, pre, Mic.sr, openMidi(x.s), 12);
      const v = noteVerdict(x.s, x.f, r, isOpen ? null : chord);
      fb.className = 'feedback ' + v.cls;
      fb.innerHTML = v.html;
      if (v.cls === 'warn') { busy = false; return; }
      state[x.s] = { ok: v.ok, short: v.ok ? 'clean' : r.fret === null || r.pitched < 0.3 ? 'muted' : `heard fret ${r.fret}` };
      if (!v.ok && !isOpen) Store.set(() => { const c = Store.chord(chord.id); c.issues[x.s] = (c.issues[x.s] || 0) + 1; });
      onStat?.(x.s, v.ok);
      render();
      if (v.ok) setTimeout(() => { if (alive) { advance(); busy = false; } }, 500);
      else setTimeout(() => (busy = false), 400);
    })];
    $('[data-skip]', root).onclick = () => { if (strings[cur]) { state[strings[cur].s] = { ok: true, short: 'skipped' }; advance(); } };
    $('[data-restart]', root).onclick = () => { Object.keys(state).forEach((k) => delete state[k]); cur = 0; fb.className = 'feedback'; fb.innerHTML = listenBadge(); render(); };
    return () => { alive = false; offs.forEach((f) => f()); };
  });
}

// ---------- Strum check ----------
function StrumCheck(root, { chord, need = 3, onPass, onStuck }) {
  return needMic(root, () => {
    let clean = 0, fails = 0, busy = false, alive = true;
    const fs = firstString(chord);
    Camera.context = { type: 'chord', chord };
    root.innerHTML = `<div class="ex">
      <div>${diagramBlock(chord, { w: 220 })}</div>
      <div class="stack">
        <div><div class="prompt">Strum ${esc(chord.id)} ${need > 1 ? `${need} times clean` : ''}</div>
        <div class="muted">${fs < 6 ? `Start your strum from ${stringLabel(fs)}. ` : 'Strum all six strings. '}One strum at a time, let it ring.</div></div>
        <div class="dots" data-dots>${'<i></i>'.repeat(need)}</div>
        <div class="feedback" data-fb>${listenBadge()}</div>
        <div class="row"><button class="btn small ghost hidden" data-stuck>🔍 Check string by string</button></div>
        <p class="small dim">${esc(chord.tip || '')}</p>
      </div></div>`;
    const fb = $('[data-fb]', root);
    const offs = [animateListen(root), Mic.on('onset', async (o) => {
      if (busy || clean >= need) return;
      busy = true;
      const pre = preOnset(o, 16384);
      const samples = await Mic.capture(o.abs, 0.03, 16384);
      if (!alive) return;
      const j = judgeChord(samples, chord.id, CHORDS.map((c) => c.id), { pre });
      const f = chordFeedback(chord, j);
      fb.className = 'feedback ' + f.cls;
      fb.innerHTML = f.html;
      if (!j.quiet) {
        Store.set(() => {
          const c = Store.chord(chord.id);
          c.tries++;
          if (j.clean) c.clean++;
          j.issues?.forEach((i) => { if (i.type === 'missing') c.issues[i.string] = (c.issues[i.string] || 0) + 1; });
        });
        if (j.clean) {
          clean++;
          $$('[data-dots] i', root).forEach((d, i) => d.classList.toggle('ok', i < clean));
          if (clean >= need) {
            fb.innerHTML = `<b>${need} clean ${esc(chord.id)} strums! ✓</b> You've got this chord.`;
            onPass?.();
          }
        } else if (++fails >= 2) $('[data-stuck]', root).classList.remove('hidden');
      }
      setTimeout(() => (busy = false), 250);
    })];
    $('[data-stuck]', root).onclick = () => onStuck?.();
    return () => { alive = false; Camera.context = null; offs.forEach((f) => f()); };
  });
}

// ---------- Chord trainer: string check, then strums ----------
function ChordTrainer(root, { chord, strums = 3, onPass, startWith = 'strings' }) {
  let inner = null;
  root.innerHTML = `<div class="stack">
    <div class="row between"><div class="seg" data-seg><button data-p="strings">1 · Each string</button><button data-p="strum">2 · Strum it</button></div>
    <span class="small muted" data-hint></span></div><div data-body></div></div>`;
  const show = (phase) => {
    inner?.();
    $$('[data-p]', root).forEach((b) => b.classList.toggle('on', b.dataset.p === phase));
    const body = $('[data-body]', root);
    Camera.context = { type: 'chord', chord };
    if (phase === 'strings') {
      $('[data-hint]', root).textContent = 'Place your fingers, then pluck one string at a time.';
      inner = StringCheck(body, { chord, onPass: () => setTimeout(() => show('strum'), 1400) });
    } else {
      $('[data-hint]', root).textContent = 'Now strum the whole chord.';
      inner = StrumCheck(body, { chord, need: strums, onPass, onStuck: () => show('strings') });
    }
  };
  $$('[data-p]', root).forEach((b) => (b.onclick = () => show(b.dataset.p)));
  show(startWith);
  return () => { inner?.(); Camera.context = null; };
}

// ---------- One-minute chord changes ----------
function ChangeDrill(root, { a, b, goal = 10, secs = 60, onPass }) {
  return needMic(root, () => {
    const A = CHORD[a], B = CHORD[b];
    const key = [a, b].sort().join('|');
    let target = 0, count = 0, running = false, endAt = 0, busy = false, alive = true, iv = null;
    const best = Store.data.changes[key]?.best || 0;
    root.innerHTML = `<div class="stack">
      <div class="row between">
        <div><div class="prompt">${esc(a)} ↔ ${esc(b)}: one-minute changes</div>
        <div class="muted">Strum ${esc(a)}, switch, strum ${esc(b)}, switch… Every clean chord counts. Goal: ${goal}. ${best ? `Your best: ${best}.` : ''}</div></div>
      </div>
      <div class="player">
        <div class="row" style="justify-content:center;gap:30px" data-diags></div>
        <div class="center stack">
          <div class="counter" data-count>0</div>
          <div class="timer" data-timer>${secs}s</div>
          <div><button class="btn primary big" data-start>Start</button></div>
        </div>
      </div>
      <div class="feedback" data-fb>Put your fingers on <b>${esc(a)}</b>, then press Start.</div>
    </div>`;
    const fb = $('[data-fb]', root);
    const paint = () => {
      $('[data-diags]', root).innerHTML = [A, B].map((c, i) => `<div style="opacity:${i === target ? 1 : 0.35};transform:scale(${i === target ? 1 : 0.9});transition:all .2s">${diagramBlock(c, { w: 170, caption: i === target ? 'play this' : 'next' })}</div>`).join('');
      Camera.context = { type: 'chord', chord: target ? B : A };
    };
    paint();
    const finish = () => {
      running = false;
      clearInterval(iv);
      $('[data-start]', root).textContent = 'Go again';
      $('[data-start]', root).disabled = false;
      const prev = Store.data.changes[key];
      Store.set((d) => {
        const c = (d.changes[key] ||= { best: 0, history: [] });
        c.best = Math.max(c.best, count);
        c.history = [...(c.history || []), count].slice(-12);
      });
      const pb = !prev || count > prev.best;
      fb.className = 'feedback ' + (count >= goal ? 'ok' : 'warn');
      fb.innerHTML = count >= goal
        ? `<b>${count} changes in a minute! ✓ ${pb && prev ? 'New personal best!' : ''}</b> Keep doing this daily. Players who can do 30 a minute play songs without stopping.`
        : `<b>${count} changes.</b> Goal is ${goal}. Tip: lift all fingers together and land them as one shape. Don't place them one at a time. Speed comes from repetition, not from rushing.`;
      if (count >= goal) onPass?.();
    };
    $('[data-start]', root).onclick = () => {
      count = 0; target = 0; running = true;
      $('[data-count]', root).textContent = '0';
      $('[data-start]', root).disabled = true;
      endAt = performance.now() + secs * 1000;
      paint();
      fb.className = 'feedback';
      fb.innerHTML = `${listenBadge()} Go! Strum <b>${esc(a)}</b>.`;
      iv = setInterval(() => {
        const left = Math.max(0, Math.ceil((endAt - performance.now()) / 1000));
        $('[data-timer]', root).textContent = left + 's';
        if (left <= 0) finish();
      }, 200);
    };
    const offs = [animateListen(root), Mic.on('onset', async (o) => {
      if (!running || busy) return;
      busy = true;
      const want = target ? b : a;
      const pre = preOnset(o, 8192);
      const samples = await Mic.capture(o.abs, 0.03, 8192);
      if (!alive || !running) { busy = false; return; }
      const j = judgeChord(samples, want, CHORDS.map((c) => c.id), { strict: false, pre });
      if (j.ok) {
        count++;
        target = 1 - target;
        $('[data-count]', root).textContent = count;
        paint();
        fb.className = 'feedback ok';
        fb.innerHTML = `<b>${esc(want)} ✓</b> Now ${esc(target ? b : a)}!`;
        Store.set(() => { const c = Store.chord(want); c.tries++; if (j.clean) c.clean++; });
      } else if (!j.quiet) {
        const f = chordFeedback(CHORD[want], j);
        fb.className = 'feedback bad';
        fb.innerHTML = f.html;
      }
      setTimeout(() => (busy = false), 150);
    })];
    return () => { alive = false; clearInterval(iv); Camera.context = null; offs.forEach((f) => f()); };
  });
}

// ---------- Latency calibration ----------
function Latency(root, { onPass }) {
  return needMic(root, () => {
    let onsets = [], clicks = [], alive = true;
    root.innerHTML = `<div class="stack">
      <p class="big">Every computer has a small delay between sound and microphone. Let's measure yours so the coach judges your timing fairly.</p>
      <p>Lay your fretting hand lightly across the strings to mute them. After 4 count-in clicks, <b>strum on each of the next 8 clicks</b>.</p>
      <div class="row"><button class="btn primary big" data-go>Start</button><div class="beat-light" data-light></div></div>
      <div class="feedback" data-fb>Current setting: ${Math.round(Store.data.settings.latency * 1000)} ms</div></div>`;
    const fb = $('[data-fb]', root);
    const off = Mic.on('onset', (o) => onsets.push(o.time));
    $('[data-go]', root).onclick = () => {
      onsets = []; clicks = [];
      $('[data-go]', root).disabled = true;
      fb.innerHTML = 'Count-in: 1… 2… 3… 4… then strum on every click.';
      Metro.start({
        bpm: 80, beatsPerBar: 4, totalBeats: 12,
        onBeat: (b, t) => {
          clicks.push(t);
          const l = $('[data-light]', root);
          if (l) { l.classList.add('on'); setTimeout(() => l.classList.remove('on'), 120); }
          if (b === 4) fb.innerHTML = '<b>Strum now, on every click!</b>';
        },
        onEnd: () => {
          if (!alive) return;
          setTimeout(() => {
            $('[data-go]', root).disabled = false;
            const offsets = clicks.slice(4).map((c) => {
              const near = onsets.filter((t) => Math.abs(t - c) < 0.3).sort((x, y) => Math.abs(x - c) - Math.abs(y - c))[0];
              return near === undefined ? null : near - c;
            }).filter((x) => x !== null).sort((x, y) => x - y);
            if (offsets.length < 4) {
              fb.className = 'feedback warn';
              fb.innerHTML = `<b>Only heard ${offsets.length} strums.</b> Strum a bit harder, right on each click, and try again.`;
              return;
            }
            const lat = Math.max(0, Math.min(0.35, offsets[offsets.length >> 1]));
            Store.set((d) => (d.settings.latency = lat));
            fb.className = 'feedback ok';
            fb.innerHTML = `<b>Done ✓ Your delay is about ${Math.round(lat * 1000)} ms.</b> The coach will take that into account.`;
            onPass?.();
          }, 400);
        },
      });
    };
    return () => { alive = false; off(); Metro.stop(); };
  });
}

// ---------- Rhythm / strumming patterns ----------
function Rhythm(root, { pattern = 'quarters', chords = ['G'], bpm = 60, bars = 4, onPass }) {
  return needMic(root, () => {
    const P = PATTERNS[pattern];
    const spb = P.slots.length; // slots per bar
    const beatsPerBar = spb / 2;
    let tempo = bpm, running = false, start = 0, events = [], extras = [], alive = true, raf = 0;
    const key = pattern;
    root.innerHTML = `<div class="stack">
      <div class="row between">
        <div><div class="prompt">${esc(P.name)}</div><div class="muted">Count: ${esc(P.count)} · ↓ = down, ↑ = up, · = skip (hand still moves)</div></div>
        <div class="row">
          <button class="btn small" data-slow>−</button><b data-bpm>${tempo} BPM</b><button class="btn small" data-fast>+</button>
          <button class="btn primary" data-go>▶ Start</button>
        </div>
      </div>
      <div class="row" data-lights>${Array.from({ length: beatsPerBar }, (_, i) => `<div class="beat-light ${i === 0 ? 'accent' : ''}"></div>`).join('')}<span class="muted small" data-state>Press start. You get one bar of clicks to count you in.</span></div>
      <div class="rgrid" data-grid></div>
      <div class="feedback" data-fb>Headphones help: then the microphone only hears your guitar.</div>
    </div>`;
    const grid = $('[data-grid]', root), fb = $('[data-fb]', root);
    const drawGrid = () => {
      grid.innerHTML = Array.from({ length: bars }, (_, b) => `<div class="rbar" style="grid-template-columns:repeat(${spb},1fr)"><span class="cname">${esc(chords[b % chords.length])}</span>${[...P.slots].map((c, j) =>
        `<div class="slot ${c === '-' ? 'rest' : c === 'U' ? 'up' : ''}" data-i="${b * spb + j}">${c === 'D' ? '↓' : c === 'U' ? '↑' : '·'}<span class="cnt">${j % 2 ? '&' : j / 2 + 1}</span></div>`).join('')}</div>`).join('');
    };
    drawGrid();
    const slotDur = () => 60 / tempo / 2;
    const setTempo = (v) => { tempo = Math.max(40, Math.min(160, v)); $('[data-bpm]', root).textContent = tempo + ' BPM'; };
    $('[data-slow]', root).onclick = () => setTempo(tempo - 5);
    $('[data-fast]', root).onclick = () => setTempo(tempo + 5);
    const slotEl = (i) => $(`[data-i="${i}"]`, grid);

    const finish = () => {
      running = false;
      cancelAnimationFrame(raf);
      $('[data-go]', root).textContent = '▶ Again';
      const total = events.length;
      const good = events.filter((e) => e.off !== null && Math.abs(e.off) <= 0.07).length;
      const near = events.filter((e) => e.off !== null && Math.abs(e.off) > 0.07).length;
      const missed = events.filter((e) => e.off === null);
      const score = Math.round(((good + near * 0.5) / total) * 100);
      const offs = events.filter((e) => e.off !== null).map((e) => e.off);
      const mean = offs.length ? offs.reduce((a, b) => a + b, 0) / offs.length : 0;
      const tips = [];
      if (mean < -0.035) tips.push(`You're <b>rushing</b> (about ${Math.round(-mean * 1000)} ms early). Wait for the click; let it pull you.`);
      if (mean > 0.045) tips.push(`You're <b>dragging</b> (about ${Math.round(mean * 1000)} ms late). Start each strum a hair sooner.`);
      const upMiss = missed.filter((e) => e.type === 'U').length, upTotal = events.filter((e) => e.type === 'U').length;
      if (upTotal && upMiss / upTotal > 0.4) tips.push('Your <b>upstrokes</b> are too light or missing. Catch the thinnest 3 strings on the way up.');
      const restHits = extras.filter((x) => x.rest).length;
      if (restHits >= 2) tips.push(`You hit the strings ${restHits} times on a <b>skip</b>. On "·" slots keep moving your hand but miss the strings.`);
      const wrongDir = events.filter((e) => e.dir && e.dir !== e.type).length;
      const dirKnown = events.filter((e) => e.dir).length;
      if (dirKnown >= 4 && wrongDir / dirKnown > 0.3) tips.push(`The camera saw ${wrongDir} strums going the <b>wrong direction</b>. Down on the numbers, up on the "&".`);
      if (!tips.length && score >= 85) tips.push('Rock solid. Bump the tempo up 5 BPM and go again.');
      Store.set((d) => (d.rhythm[key] = Math.max(d.rhythm[key] || 0, score)));
      fb.className = 'feedback ' + (score >= 70 ? 'ok' : 'warn');
      fb.innerHTML = `<b>${score}% on the beat ${score >= 70 ? '✓' : ''}</b> ${good} right on, ${near} a bit off, ${missed.length} missed.<br>${tips.join('<br>')}`;
      if (score >= 70) onPass?.();
      Camera.context = null;
    };

    $('[data-go]', root).onclick = () => {
      if (running) { Metro.stop(); finish(); return; }
      drawGrid();
      events = []; extras = [];
      running = true;
      $('[data-go]', root).textContent = '■ Stop';
      fb.className = 'feedback';
      fb.innerHTML = 'Count-in… get ready.';
      Camera.context = { type: 'rhythm' };
      const lights = $$('[data-lights] .beat-light', root);
      Metro.start({
        bpm: tempo, beatsPerBar, totalBeats: beatsPerBar * (bars + 1),
        onStart: (t0) => {
          start = t0 + beatsPerBar * (60 / tempo);
          for (let i = 0; i < bars * spb; i++) {
            const c = P.slots[i % spb];
            if (c !== '-') events.push({ i, type: c, t: start + i * slotDur(), off: null, dir: null });
          }
        },
        onBeat: (b) => {
          lights.forEach((l, i) => l.classList.toggle('on', i === b % beatsPerBar));
          $('[data-state]', root).textContent = b < beatsPerBar ? `Count-in: ${b + 1}` : `Bar ${Math.floor(b / beatsPerBar)} of ${bars}`;
          if (b === beatsPerBar) fb.innerHTML = `${listenBadge()} Play!`;
        },
        onEnd: () => setTimeout(() => alive && running && finish(), 300),
      });
      const loop = () => {
        if (!running) return;
        const now = Mic.ctx.currentTime;
        const idx = Math.floor((now - start) / slotDur());
        $$('.slot.now', grid).forEach((s) => s.classList.remove('now'));
        if (idx >= 0) slotEl(idx)?.classList.add('now');
        events.forEach((e) => {
          if (e.off === null && !e.marked && now - e.t > slotDur() * 0.5 + Store.data.settings.latency + 0.05) {
            e.marked = true;
            slotEl(e.i)?.classList.add('miss');
          }
        });
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    };

    const offs = [animateListen(root), Mic.on('onset', (o) => {
      if (!running) return;
      const t = o.time - Store.data.settings.latency;
      const sd = slotDur();
      if (t < start - sd * 0.5) return;
      let best = null;
      for (const e of events) if (e.off === null && Math.abs(t - e.t) < sd * 0.5 && (!best || Math.abs(t - e.t) < Math.abs(t - best.t))) best = e;
      if (best) {
        best.off = t - best.t;
        best.dir = Camera.directionAt(o.time);
        const el = slotEl(best.i);
        el?.classList.remove('miss');
        el?.classList.add(Math.abs(best.off) <= 0.07 ? 'hit' : 'near');
        if (Camera.context) Camera.context.last = { want: best.type, got: best.dir };
      } else {
        const i = Math.round((t - start) / sd);
        if (i >= 0 && i < bars * spb) {
          const rest = P.slots[i % spb] === '-';
          extras.push({ i, rest });
          if (rest) slotEl(i)?.classList.add('extra');
        }
      }
    })];
    return () => { alive = false; running = false; Metro.stop(); cancelAnimationFrame(raf); Camera.context = null; offs.forEach((f) => f()); };
  });
}

// ---------- Riffs (single notes) ----------
function Riff(root, { riff, tempo = false, onPass }) {
  return needMic(root, () => {
    let cur = 0, busy = false, alive = true, mode = 'step', statuses = {}, mistakes = 0;
    let playing = false, notesT = [], speed = 0.7, raf = 0;
    root.innerHTML = `<div class="stack">
      <div class="row between"><div><div class="prompt">${esc(riff.title)}</div><div class="muted">${esc(riff.note)}</div></div>
      ${tempo ? `<div class="seg" data-mode><button data-m="step" class="on">Note by note</button><button data-m="time">In time</button></div>` : ''}</div>
      <div class="card flat" data-tab></div>
      <div data-controls></div>
      <div class="feedback" data-fb>${listenBadge()}</div>
      <p class="small dim">How to read tab: each line is a string (thin high e on top, thick low E on the bottom). The number is the fret. 0 = open string.</p>
    </div>`;
    const fb = $('[data-fb]', root);
    const drawTab = () => ($('[data-tab]', root).innerHTML = tabHTML(riff.notes, mode === 'step' ? cur : -1, statuses));
    const prompt = () => {
      if (mode !== 'step') return;
      const n = riff.notes[cur];
      $('[data-controls]', root).innerHTML = n
        ? `<div class="row"><span class="big">Next: <b>${stringLabel(n.s)}</b>, ${n.f ? `<b>fret ${n.f}</b>` : '<b>open</b>'} → ${DSP.noteName(openMidi(n.s) + n.f)}</span><span class="grow"></span><button class="btn small ghost" data-restart>Start over</button></div>`
        : '';
      const r = $('[data-restart]', root);
      if (r) r.onclick = () => { cur = 0; statuses = {}; mistakes = 0; drawTab(); prompt(); };
    };
    drawTab();
    prompt();

    const stepDone = () => {
      fb.className = 'feedback ok';
      fb.innerHTML = `<b>You played the whole riff! ✓</b> ${mistakes ? `${plural(mistakes, 'wrong note')} along the way. ` : 'No mistakes! '}${tempo ? 'Now try it <b>in time</b> with the metronome (top right).' : ''}`;
      Store.set((d) => { (d.riffs[riff.id] ||= {}).done = true; });
      onPass?.();
    };

    const startTime = () => {
      statuses = {};
      drawTab();
      playing = true;
      const bpm = riff.bpm * speed;
      const spbeat = 60 / bpm;
      let beat = 0;
      const offsets = riff.notes.map((n) => { const b = beat; beat += n.b; return b; });
      const totalBeats = Math.ceil(beat) + 4;
      fb.className = 'feedback';
      fb.innerHTML = 'Count-in: 4 clicks, then play.';
      Metro.start({
        bpm, beatsPerBar: 4, totalBeats,
        onStart: (t0) => { notesT = offsets.map((b, i) => ({ i, t: t0 + (4 + b) * spbeat, got: null })); },
        onBeat: (b) => { if (b === 4) fb.innerHTML = `${listenBadge()} Play!`; },
        onEnd: () => setTimeout(() => {
          if (!alive) return;
          playing = false;
          cancelAnimationFrame(raf);
          const hits = notesT.filter((n) => n.got === 'ok').length;
          const pct = Math.round((hits / notesT.length) * 100);
          Store.set((d) => { const r = (d.riffs[riff.id] ||= {}); r.best = Math.max(r.best || 0, pct); });
          fb.className = 'feedback ' + (pct >= 70 ? 'ok' : 'warn');
          fb.innerHTML = `<b>${pct}% of notes right and on time.</b> ${pct >= 85 ? 'Try a faster speed!' : pct >= 50 ? 'Getting there. Go again.' : 'Try "Note by note" a few more times, or slow it down.'}`;
          drawTab();
        }, 400),
      });
      const loop = () => {
        if (!playing) return;
        const now = Mic.ctx.currentTime - Store.data.settings.latency;
        notesT.forEach((n) => { if (!n.got && now - n.t > 0.35) { n.got = 'miss'; statuses[n.i] = 'bad'; drawTab(); } });
        const next = notesT.find((n) => n.t > now - 0.1);
        $$('.tab .cell.cur', root).forEach((c) => c.classList.remove('cur'));
        if (next) $$(`.tab .line`, root).forEach((line) => line.children[next.i + 1]?.classList.add('cur'));
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    };

    if (tempo) {
      $$('[data-m]', root).forEach((b) => (b.onclick = () => {
        mode = b.dataset.m;
        $$('[data-m]', root).forEach((x) => x.classList.toggle('on', x === b));
        Metro.stop(); playing = false; statuses = {}; cur = 0;
        drawTab();
        if (mode === 'step') { prompt(); fb.className = 'feedback'; fb.innerHTML = listenBadge(); }
        else {
          $('[data-controls]', root).innerHTML = `<div class="row"><span class="muted">Speed</span><div class="seg" data-speed>${[0.5, 0.7, 0.85, 1].map((s) => `<button data-v="${s}" class="${s === speed ? 'on' : ''}">${Math.round(s * 100)}%</button>`).join('')}</div><button class="btn primary" data-play>▶ Play along</button></div>`;
          $$('[data-v]', root).forEach((x) => (x.onclick = () => { speed = +x.dataset.v; $$('[data-v]', root).forEach((y) => y.classList.toggle('on', y === x)); }));
          $('[data-play]', root).onclick = startTime;
          fb.className = 'feedback';
          fb.innerHTML = 'Press play. You get 4 clicks, then the highlighted note moves with the beat.';
        }
      }));
    }

    const offs = [animateListen(root), Mic.on('onset', async (o) => {
      if (busy) return;
      if (mode === 'step') {
        const n = riff.notes[cur];
        if (!n) return;
        busy = true;
        const pre = Mic.read(o.abs - 8192 - Math.round(0.01 * Mic.sr), 8192);
        const post = await Mic.capture(o.abs, 0.015, 8192);
        if (!alive) return;
        const r = DSP.checkString(post, pre, Mic.sr, openMidi(n.s), 15);
        const v = noteVerdict(n.s, n.f, r, null);
        fb.className = 'feedback ' + v.cls;
        fb.innerHTML = v.html;
        if (v.ok) {
          statuses[cur] = 'ok';
          cur++;
          drawTab();
          prompt();
          if (cur >= riff.notes.length) stepDone();
        } else if (v.cls === 'bad') mistakes++;
        setTimeout(() => (busy = false), 120);
      } else if (playing) {
        const t = o.time - Store.data.settings.latency;
        const n = notesT.filter((x) => !x.got && Math.abs(x.t - t) < 0.22).sort((a, b) => Math.abs(a.t - t) - Math.abs(b.t - t))[0];
        if (!n) return;
        busy = true;
        const note = riff.notes[n.i];
        const pre = Mic.read(o.abs - 4096 - Math.round(0.01 * Mic.sr), 4096);
        const post = await Mic.capture(o.abs, 0.015, 8192);
        if (!alive) return;
        const r = DSP.checkString(post, pre.length ? pre : null, Mic.sr, openMidi(note.s), 15);
        n.got = r.fret === note.f && r.pitched >= 0.3 ? 'ok' : 'bad';
        statuses[n.i] = n.got === 'ok' ? 'ok' : 'bad';
        drawTab();
        busy = false;
      }
    })];
    return () => { alive = false; playing = false; Metro.stop(); cancelAnimationFrame(raf); offs.forEach((f) => f()); };
  });
}

// Strum Coach — song player, screens, camera panel and navigation.

// ---------- Song player ----------
function SongPlayer(root, { song, onPass }) {
  return needMic(root, () => {
    const { segs, totalBeats } = songTimeline(song);
    const pool = songChords(song);
    // Practice mode steps through each chord *change* (repeats collapsed).
    const steps = [];
    segs.forEach((s, i) => { if (!steps.length || steps[steps.length - 1].chord !== s.chord) steps.push({ chord: s.chord, segs: [i] }); else steps[steps.length - 1].segs.push(i); });
    let mode = 'step', cur = 0, fails = 0, busy = false, alive = true, playing = false, speed = 0.7;
    let start = 0, spb = 1, iv = null, raf = 0, modal = null;
    const hits = new Array(segs.length).fill(null);
    const saved = Store.data.songs[song.id] || {};

    root.innerHTML = `<div class="stack">
      <div class="row between">
        <div class="seg" data-mode><button data-m="step" class="on">🐢 Practice (waits for you)</button><button data-m="play">🎵 Play along (keeps the beat)</button></div>
        <div class="row small muted">${esc(PATTERNS[song.pattern].name)} strum · ${song.bpm} BPM · ${song.beats}/4 ${saved.best != null ? `· best ${saved.best}%` : ''}</div>
      </div>
      <div class="card flat"><div class="player">
        <div class="row" style="justify-content:center;gap:28px" data-now></div>
        <div class="stack center" data-side></div>
      </div></div>
      <div class="feedback" data-fb></div>
      <div class="chart" data-chart></div>
      <div class="card flat"><h3>Chords in this song</h3><div class="row" style="gap:18px" data-chords></div><p class="small dim" style="margin:10px 0 0">Click a chord to check it string by string.</p></div>
    </div>`;
    const fb = $('[data-fb]', root);

    // Chart grouped into bars
    const drawChart = (nowSeg = -1) => {
      let html = '', sec = null, barBeats = 0;
      segs.forEach((s, i) => {
        const header = `${s.section}`;
        if (header !== sec || (i > 0 && segs[i - 1].section === s.section && s.start === 0)) {
          if (sec !== null) html += '</div></div></div>';
          const repeatStart = sec === header;
          sec = header;
          html += `<div class="sec"><h3>${esc(header)}${repeatStart ? ' (again)' : ''}</h3><div class="bars"><div class="barbox">`;
          barBeats = 0;
        } else if (barBeats >= song.beats) {
          html += '</div><div class="barbox">';
          barBeats = 0;
        }
        const cls = i === nowSeg ? 'now' : hits[i] === true ? 'hit' : hits[i] === false ? 'miss' : '';
        html += `<span class="c ${cls}" style="flex:${s.beats}">${esc(s.chord)}</span>`;
        barBeats += s.beats;
      });
      html += '</div></div></div>';
      $('[data-chart]', root).innerHTML = html;
    };

    $('[data-chords]', root).innerHTML = pool.map((id) => `<button class="btn ghost" data-chord="${esc(id)}" style="padding:8px">${chordSVG(CHORD[id], { w: 90 })}<b>${esc(id)}</b></button>`).join('');
    $$('[data-chord]', root).forEach((b) => (b.onclick = () => openChordModal(CHORD[b.dataset.chord])));

    const openChordModal = (chord) => {
      stopPlay();
      modal?.close();
      modal = showModal(`<div class="row between"><h2>Check ${esc(chord.id)}</h2><button class="btn small" data-close>Done</button></div><div data-body></div>`, (m) => {
        const c = ChordTrainer($('[data-body]', m), { chord, strums: 2 });
        return () => c();
      });
    };

    const showStep = () => {
      const st = steps[cur];
      const nextC = steps[cur + 1]?.chord;
      drawChart(st ? st.segs[0] : -1);
      if (!st) return;
      $('[data-now]', root).innerHTML = diagramBlock(CHORD[st.chord], { w: 200 }) + (nextC ? diagramBlock(CHORD[nextC], { w: 130, next: true, caption: 'next' }) : '');
      $('[data-side]', root).innerHTML = `<div class="prompt">Strum ${esc(st.chord)}</div><div class="muted">Chord ${cur + 1} of ${steps.length} · ${esc(segs[st.segs[0]].section)}</div>
        <div class="row" style="justify-content:center"><button class="btn small ghost" data-back>← Back</button><button class="btn small ghost" data-skip>Skip →</button><button class="btn small ghost" data-restart>Restart</button></div>`;
      $('[data-back]', root).onclick = () => { cur = Math.max(0, cur - 1); fails = 0; showStep(); };
      $('[data-skip]', root).onclick = () => { steps[cur].segs.forEach((i) => (hits[i] = false)); cur++; fails = 0; cur >= steps.length ? stepFinish() : showStep(); };
      $('[data-restart]', root).onclick = () => { cur = 0; fails = 0; hits.fill(null); showStep(); fb.className = 'feedback'; fb.innerHTML = listenBadge(); };
      Camera.context = { type: 'chord', chord: CHORD[st.chord] };
    };

    const stepFinish = () => {
      drawChart();
      const ok = hits.filter((h) => h === true).length;
      $('[data-now]', root).innerHTML = '<div class="celebrate"><div class="emoji">🎉</div></div>';
      $('[data-side]', root).innerHTML = `<div class="prompt">You played the whole song!</div><div class="muted">Next: switch to <b>Play along</b> and do it in time with the beat.</div>`;
      fb.className = 'feedback ok';
      fb.innerHTML = `<b>Song complete ✓</b> ${ok} of ${segs.length} chords clean on the first go.`;
      Store.set((d) => { (d.songs[song.id] ||= {}).practiced = true; });
      Camera.context = null;
      onPass?.();
    };

    const stopPlay = () => {
      if (!playing) return;
      playing = false;
      Metro.stop();
      clearInterval(iv);
      cancelAnimationFrame(raf);
    };

    const setupPlay = () => {
      stopPlay();
      hits.fill(null);
      drawChart();
      const bpm = Math.round(song.bpm * speed);
      $('[data-now]', root).innerHTML = diagramBlock(CHORD[segs[0].chord], { w: 200 }) + (segs[1] ? diagramBlock(CHORD[segs.find((s) => s.chord !== segs[0].chord)?.chord || segs[1].chord], { w: 130, next: true, caption: 'next' }) : '');
      $('[data-side]', root).innerHTML = `
        <div class="stack">
          <div><span class="muted">Speed: </span><b data-speedlbl>${Math.round(speed * 100)}% (${bpm} BPM)</b><input type="range" min="40" max="100" step="5" value="${speed * 100}" data-speed></div>
          <div class="beats" data-beats>${Array.from({ length: song.beats }, (_, i) => `<div class="beat-light ${i === 0 ? 'accent' : ''}"></div>`).join('')}</div>
          <div class="muted" data-count>You get one bar of clicks to count you in.</div>
          <div><button class="btn primary big" data-play>▶ Start</button></div>
        </div>`;
      $('[data-speed]', root).oninput = (e) => {
        speed = e.target.value / 100;
        $('[data-speedlbl]', root).textContent = `${e.target.value}% (${Math.round(song.bpm * speed)} BPM)`;
      };
      $('[data-play]', root).onclick = () => (playing ? (stopPlay(), setupPlay()) : play());
      fb.className = 'feedback';
      fb.innerHTML = `Strum the <b>${esc(PATTERNS[song.pattern].name.toLowerCase())}</b> pattern (or just one strum per beat) and change chords when the chart moves. The coach listens for each chord.`;
    };

    const play = () => {
      playing = true;
      hits.fill(null);
      const bpm = song.bpm * speed;
      spb = 60 / bpm;
      $('[data-play]', root).textContent = '■ Stop';
      const lights = $$('[data-beats] .beat-light', root);
      const segHeard = segs.map(() => ({ tries: 0, good: 0 }));
      Camera.context = { type: 'rhythm' };
      Metro.start({
        bpm, beatsPerBar: song.beats, totalBeats: song.beats + totalBeats,
        onStart: (t0) => (start = t0 + song.beats * spb),
        onBeat: (b) => {
          lights.forEach((l, i) => l.classList.toggle('on', i === b % song.beats));
          const cnt = $('[data-count]', root);
          if (cnt) cnt.textContent = b < song.beats ? `Count-in: ${b + 1}` : `Bar ${Math.floor((b - song.beats) / song.beats) + 1}`;
        },
        onEnd: () => setTimeout(() => alive && playing && playFinish(), 300),
      });
      let lastSeg = -1, lastHits = 0;
      iv = setInterval(() => {
        // Listen: grab the last ~170 ms and check it against the chord that should be sounding.
        const now = Mic.ctx.currentTime - Store.data.settings.latency;
        const beat = (now - start) / spb;
        const i = segs.findIndex((s) => beat >= s.start && beat < s.start + s.beats);
        if (i < 0 || hits[i] === true) return;
        const windowStart = now - 8192 / Mic.sr;
        if (windowStart < start + segs[i].start * spb + 0.05) return;
        if (Mic.level < 0.004) return;
        const j = judgeChord(Mic.latest(8192), segs[i].chord, pool, { strict: false });
        if (j.quiet) return;
        segHeard[i].tries++;
        if (j.ok) { segHeard[i].good++; if (segHeard[i].good >= 1) hits[i] = true; }
      }, 110);
      const loop = () => {
        if (!playing) return;
        const now = Mic.ctx.currentTime;
        const beat = (now - start) / spb;
        const i = segs.findIndex((s) => beat >= s.start && beat < s.start + s.beats);
        let changed = false;
        segs.forEach((s, k) => { if (hits[k] === null && beat >= s.start + s.beats + 0.3) { hits[k] = false; changed = true; } });
        if (changed || hits.filter(Boolean).length !== lastHits) { lastHits = hits.filter(Boolean).length; drawChart(i); }
        if (i !== lastSeg) {
          lastSeg = i;
          drawChart(i);
          if (i >= 0) {
            const nextSeg = segs.slice(i + 1).find((s) => s.chord !== segs[i].chord);
            $('[data-now]', root).innerHTML = diagramBlock(CHORD[segs[i].chord], { w: 200 }) + (nextSeg ? diagramBlock(CHORD[nextSeg.chord], { w: 130, next: true, caption: 'next' }) : '');
          }
        } else if (i >= 0 && hits[i] === true) {
          const c = $('.chart .c.now', root);
          if (c && !c.dataset.g) { c.dataset.g = 1; c.style.boxShadow = '0 0 0 2px var(--ok)'; }
        }
        if (i >= 0) {
          const nextSeg = segs.slice(i + 1).find((s) => s.chord !== segs[i].chord);
          if (nextSeg) {
            const beatsLeft = Math.ceil(nextSeg.start - beat);
            fb.className = 'feedback';
            fb.innerHTML = beatsLeft <= 2 ? `<b>Get ready: ${esc(nextSeg.chord)} in ${beatsLeft}…</b>` : `${listenBadge()} ${hits[i] ? `<b style="display:inline;color:var(--ok)">${esc(segs[i].chord)} ✓</b>` : `Playing <b style="display:inline">${esc(segs[i].chord)}</b>`}`;
          }
        }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    };

    const playFinish = () => {
      stopPlay();
      segs.forEach((s, k) => { if (hits[k] === null) hits[k] = false; });
      drawChart();
      const ok = hits.filter(Boolean).length;
      const pct = Math.round((ok / segs.length) * 100);
      // What went wrong: which chords and which changes
      const missByChord = {}, missByChange = {};
      segs.forEach((s, k) => {
        if (hits[k]) return;
        missByChord[s.chord] = (missByChord[s.chord] || 0) + 1;
        const prev = segs.slice(0, k).reverse().find((p) => p.chord !== s.chord);
        if (prev) { const key = `${prev.chord}→${s.chord}`; missByChange[key] = (missByChange[key] || 0) + 1; }
      });
      const worstChange = Object.entries(missByChange).sort((a, b) => b[1] - a[1])[0];
      const worstChord = Object.entries(missByChord).sort((a, b) => b[1] - a[1])[0];
      const prevBest = Store.data.songs[song.id]?.best;
      Store.set((d) => {
        const s = (d.songs[song.id] ||= {});
        s.best = Math.max(s.best || 0, pct);
        s.plays = (s.plays || 0) + 1;
        s.lastSpeed = speed;
        if (worstChange) s.trouble = worstChange[0];
      });
      let tips = '';
      if (pct >= 85) tips = speed < 1 ? `Great! Bump the speed up to ${Math.round(Math.min(1, speed + 0.1) * 100)}%.` : "You can play this song. Seriously. Go play it for someone!";
      else if (worstChange && worstChange[1] >= 2) {
        const [x, y] = worstChange[0].split('→');
        tips = `You mostly lost it on the <b>${esc(x)} → ${esc(y)}</b> change (${worstChange[1]} misses). <a href="#/drill/${encodeURIComponent(x)}/${encodeURIComponent(y)}">Drill ${esc(x)} ↔ ${esc(y)} for a minute</a>, then come back.`;
      } else if (worstChord) tips = `<b>${esc(worstChord[0])}</b> was missed most. <a href="#/chord/${encodeURIComponent(worstChord[0])}">Check it string by string</a>.`;
      if (pct < 50 && speed > 0.5) tips += ' Also try a slower speed.';
      fb.className = 'feedback ' + (pct >= 60 ? 'ok' : 'warn');
      fb.innerHTML = `<b>${pct}% of chords heard clean ${pct >= 60 ? '✓' : ''} ${prevBest != null && pct > prevBest ? '· New best!' : ''}</b> ${tips}`;
      $('[data-play]', root).textContent = '▶ Play again';
      $('[data-play]', root).onclick = () => { setupPlay(); play(); };
      Camera.context = null;
      if (pct >= 60) onPass?.();
    };

    $$('[data-m]', root).forEach((b) => (b.onclick = () => {
      mode = b.dataset.m;
      $$('[data-m]', root).forEach((x) => x.classList.toggle('on', x === b));
      stopPlay();
      if (mode === 'step') { cur = 0; fails = 0; hits.fill(null); fb.className = 'feedback'; fb.innerHTML = listenBadge(); showStep(); }
      else setupPlay();
    }));

    const offs = [animateListen(root), Mic.on('onset', async (o) => {
      if (mode !== 'step' || busy || cur >= steps.length || modal?.open) return;
      busy = true;
      const st = steps[cur];
      const pre = preOnset(o, 16384);
      const samples = await Mic.capture(o.abs, 0.03, 16384);
      if (!alive || mode !== 'step') { busy = false; return; }
      const j = judgeChord(samples, st.chord, pool, { strict: false, pre });
      if (j.quiet) { busy = false; return; }
      if (j.ok) {
        st.segs.forEach((i) => (hits[i] = fails === 0));
        fb.className = 'feedback ok';
        fb.innerHTML = `<b>${esc(st.chord)} ✓</b>`;
        cur++;
        fails = 0;
        if (cur >= steps.length) stepFinish(); else showStep();
      } else {
        fails++;
        const f = chordFeedback(CHORD[st.chord], j);
        fb.className = 'feedback bad';
        fb.innerHTML = f.html + (fails >= 3 ? ` <button class="btn small" data-fix>🔍 Check ${esc(st.chord)} string by string</button>` : '');
        const fix = $('[data-fix]', fb);
        if (fix) fix.onclick = () => openChordModal(CHORD[st.chord]);
      }
      setTimeout(() => (busy = false), 200);
    })];

    fb.innerHTML = listenBadge() + ' Strum each chord once. The song moves on when it hears the right chord.';
    showStep();
    return () => { alive = false; stopPlay(); modal?.close(); Camera.context = null; offs.forEach((f) => f()); };
  });
}

function showModal(html, mount) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal card">${html}</div>`;
  document.body.appendChild(bg);
  let cleanup = null;
  const api = {
    open: true,
    close() { if (!api.open) return; api.open = false; cleanup?.(); bg.remove(); },
  };
  cleanup = mount?.(bg) || null;
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) api.close(); });
  return api;
}

const lessonDone = (id) => !!Store.data.lessons[id];
const nextLesson = () => LESSONS.find((l) => !lessonDone(l.id));
const totalMins = LESSONS.reduce((a, l) => a + l.mins, 0);
const doneMins = () => LESSONS.filter((l) => lessonDone(l.id)).reduce((a, l) => a + l.mins, 0);
const chordLearned = (id) => (Store.data.chords[id]?.clean || 0) >= 3;
const fmtMins = (secs) => (secs < 3600 ? `${Math.round(secs / 60)} min` : `${(secs / 3600).toFixed(1)} h`);

function coachSuggestions() {
  const d = Store.data;
  const out = [];
  const next = nextLesson();
  if (!Mic.running) out.push({ ico: '🎤', html: '<b>Turn on your microphone</b> so I can hear you play.', btn: 'Turn on', act: () => Mic.start(d.settings.micId).then(() => route()) });
  if (d.tunedOn !== Store.today()) out.push({ ico: '🎯', html: "<b>Tune up first.</b> You haven't tuned today, and an out-of-tune guitar makes even perfect fingers sound wrong.", btn: 'Tune (1 min)', href: '#/tuner' });
  if (Store.practiceToday() >= 40 * 60) out.push({ ico: '🧊', html: `<b>You've played ${fmtMins(Store.practiceToday())} today.</b> Nice! Fingertips toughen up during rest. Take a 10-minute break before more.` });
  const trouble = Object.entries(d.chords)
    .map(([id, c]) => ({ id, ...c, rate: c.tries ? c.clean / c.tries : 1 }))
    .filter((c) => c.tries >= 4 && c.rate < 0.6 && CHORD[c.id])
    .sort((a, b) => a.rate - b.rate)[0];
  if (trouble) {
    const worst = Object.entries(trouble.issues || {}).sort((a, b) => b[1] - a[1])[0];
    out.push({
      ico: '🔍',
      html: `<b>${esc(trouble.id)} is clean ${Math.round(trouble.rate * 100)}% of the time.</b> ${worst ? `${cap(stringLabel(+worst[0]))} is usually the problem (${plural(worst[1], 'time')}). ${mutedAdvice(CHORD[trouble.id], +worst[0])}` : 'Run the string-by-string check to find the problem string.'}`,
      btn: `Fix ${trouble.id}`, href: `#/chord/${encodeURIComponent(trouble.id)}`,
    });
  }
  const slow = Object.entries(d.changes).filter(([, v]) => v.best < 25).sort((a, b) => a[1].best - b[1].best)[0];
  if (slow) {
    const [x, y] = slow[0].split('|');
    out.push({ ico: '⏱️', html: `<b>${esc(x)} ↔ ${esc(y)} is your slowest change</b> (best ${slow[1].best} per minute). Songs flow at about 25+. One minute of this a day fixes it fast.`, btn: 'Drill it', href: `#/drill/${encodeURIComponent(x)}/${encodeURIComponent(y)}` });
  }
  const songTrouble = Object.entries(d.songs).filter(([id, s]) => s.best != null && s.best < 70 && SONGS.find((x) => x.id === id)).sort((a, b) => a[1].best - b[1].best)[0];
  if (songTrouble) {
    const s = SONGS.find((x) => x.id === songTrouble[0]);
    out.push({ ico: '🎵', html: `<b>${esc(s.title)}: best ${songTrouble[1].best}%.</b> ${songTrouble[1].trouble ? `The ${esc(songTrouble[1].trouble)} change trips you up.` : ''} Try it at a slower speed until it's 80%+.`, btn: 'Play it', href: `#/song/${s.id}` });
  }
  if (next) out.push({ ico: '👉', html: `<b>Next lesson: ${esc(next.title)}</b> (${next.mins} min) in "${esc(next.moduleTitle)}".`, btn: 'Start', href: `#/lesson/${next.id}` });
  else {
    const untried = SONGS.find((s) => !d.songs[s.id]?.best);
    if (untried) out.push({ ico: '🎸', html: `<b>Quickstart complete!</b> Learn a new song: <b>${esc(untried.title)}</b>.`, btn: 'Go', href: `#/song/${untried.id}` });
  }
  return out.slice(0, 5);
}

function tipsHTML(list) {
  return list.map((t, i) => `<div class="tip"><div class="ico">${t.ico}</div><div class="grow"><p>${t.html}</p></div>${t.btn ? (t.href ? `<a class="btn small" href="${t.href}">${esc(t.btn)}</a>` : `<button class="btn small" data-act="${i}">${esc(t.btn)}</button>`) : ''}</div>`).join('');
}

  $$('[data-act]', root).forEach((b) => (b.onclick = () => list[+b.dataset.act].act()));
}

  },

  tuner(root) {
    root.innerHTML = `<h1>Tuner</h1><p class="muted big">Pluck a string. It finds the closest string automatically, or click one to lock it.</p><div data-x></div>`;
    return Tuner($('[data-x]', root), {});
  },

  settings(root) {
    const s = Store.data.settings;
    root.innerHTML = `<h1>Settings</h1><div class="card">
      <div class="setting"><div class="d"><b>Microphone</b><div class="small muted">Use the mic closest to your guitar. A USB or headset mic beats a laptop mic.</div></div><select data-mic><option value="">Default</option></select></div>
      <div class="setting"><div class="d"><b>Camera</b></div><select data-cam><option value="">Default</option></select></div>
      <div class="setting"><div class="d"><b>Left-handed</b><div class="small muted">Flips chord diagrams and swaps which hand the camera treats as your strumming hand.</div></div><label class="toggle"><input type="checkbox" data-lefty ${s.lefty ? 'checked' : ''}> Lefty</label></div>
      <div class="setting"><div class="d"><b>Camera mixes up my hands</b><div class="small muted">If the camera labels your fretting hand as "strumming", turn this on.</div></div><label class="toggle"><input type="checkbox" data-swap ${s.swapHands ? 'checked' : ''}> Swap hands</label></div>
      <div class="setting"><div class="d"><b>Listening sensitivity</b><div class="small muted">Raise it if the coach misses soft strums. Lower it if it reacts to noise or talking.</div></div><input type="range" min="0.5" max="2" step="0.1" value="${s.sensitivity}" data-sens style="max-width:220px"></div>
      <div class="setting"><div class="d"><b>Metronome volume</b></div><input type="range" min="0.1" max="1" step="0.05" value="${s.clickVol}" data-vol style="max-width:220px"></div>
      <div class="setting"><div class="d"><b>Timing delay: <span data-lat>${Math.round(s.latency * 1000)} ms</span></b><div class="small muted">Measured so rhythm scores are fair. Re-run if you change headphones or speakers.</div></div><a class="btn small" href="#/calibrate">Measure again</a></div>
      <div class="setting"><div class="d"><b>Your progress</b><div class="small muted">Saved in this browser on this computer. Download a backup to move it to another computer.</div></div>
        <div class="row"><button class="btn small" data-export>Download backup</button><label class="btn small">Restore backup<input type="file" accept=".json" data-import hidden></label><button class="btn small danger" data-reset>Reset everything</button></div></div>
    </div>`;
    navigator.mediaDevices?.enumerateDevices?.().then((list) => {
      const fill = (sel, kind, cur) => list.filter((d) => d.kind === kind).forEach((d, i) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || `${kind === 'audioinput' ? 'Microphone' : 'Camera'} ${i + 1}`)}</option>`));
      fill($('[data-mic]', root), 'audioinput', s.micId);
      fill($('[data-cam]', root), 'videoinput', s.camId);
    });
    $('[data-mic]', root).onchange = async (e) => { Store.set((d) => (d.settings.micId = e.target.value)); if (Mic.running) { Mic.stop(); await Mic.start(e.target.value); } toast('Microphone changed'); };
    $('[data-cam]', root).onchange = async (e) => { Store.set((d) => (d.settings.camId = e.target.value)); if (Camera.active) { Camera.stop(); await Camera.start(e.target.value); } toast('Camera changed'); };
    $('[data-lefty]', root).onchange = (e) => Store.set((d) => (d.settings.lefty = e.target.checked));
    $('[data-swap]', root).onchange = (e) => Store.set((d) => (d.settings.swapHands = e.target.checked));
    $('[data-sens]', root).oninput = (e) => { Store.set((d) => (d.settings.sensitivity = +e.target.value)); Mic.setSensitivity(+e.target.value); };
    $('[data-vol]', root).oninput = (e) => Store.set((d) => (d.settings.clickVol = +e.target.value));
    $('[data-export]', root).onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' }));
      a.download = `strum-coach-backup-${Store.today()}.json`;
      a.click();
    };
    $('[data-import]', root).onchange = async (e) => {
      try { Store.import(await e.target.files[0].text()); toast('Progress restored ✓'); route(); }
      catch (err) { toast('That file didn’t work: ' + esc(err.message)); }
    };
    $('[data-reset]', root).onclick = () => { if (confirm('Erase all your progress? This cannot be undone.')) { Store.reset(); toast('Progress reset'); route(); } };
  },

  calibrate(root) {
    root.innerHTML = `<a href="#/settings" class="muted small">← Settings</a><h1 style="margin-top:10px">Measure timing delay</h1><div class="card" data-x></div>`;
    return Latency($('[data-x]', root), { onPass: () => {} });
  },

  notFound(root) {
    root.innerHTML = '<h1>Not found</h1><p><a href="#/">Go home</a></p>';
  },
};

// ---------- Camera panel ----------
const HAND_LINKS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];

function CameraPanel() {
  const panel = $('#campanel');
  const cv = $('canvas', panel);
  const g = cv.getContext('2d');
  const coach = $('.coach', panel);
  let lastCoach = 0;
  $('[data-min]', panel).onclick = () => document.body.classList.toggle('cam-min', panel.classList.toggle('min'));
  $('[data-swap]', panel).onclick = () => { Store.set((d) => (d.settings.swapHands = !d.settings.swapHands)); toast('Swapped which hand is which'); };
  $('[data-off]', panel).onclick = () => Camera.stop();
  Camera.on('state', () => {
    panel.classList.toggle('hidden', !Camera.active);
    document.body.classList.toggle('cam-on', Camera.active);
  });

  const drawHand = (hand, color, label) => {
    const W = cv.width, H = cv.height;
    const P = (p) => [(1 - p.x) * W, p.y * H];
    g.strokeStyle = color; g.lineWidth = 2.5;
    HAND_LINKS.forEach(([a, b]) => { const [x1, y1] = P(hand.lm[a]); const [x2, y2] = P(hand.lm[b]); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); });
    hand.lm.forEach((p, i) => {
      const [x, y] = P(p);
      let c = color;
      if (label === 'fretting' && [8, 12, 16, 20].includes(i)) {
        const st = Camera.fingerState(i / 4 - 1);
        c = st === 'flat' ? '#ff6b5b' : st === 'curled' ? '#3ecf8e' : color;
      }
      g.fillStyle = c; g.beginPath(); g.arc(x, y, [4, 8, 12, 16, 20].includes(i) ? 5 : 3, 0, Math.PI * 2); g.fill();
    });
    const [wx, wy] = P(hand.lm[0]);
    g.font = 'bold 13px system-ui'; g.fillStyle = 'rgba(0,0,0,.6)';
    const tw = g.measureText(label).width;
    g.fillRect(wx - tw / 2 - 5, wy + 8, tw + 10, 20);
    g.fillStyle = color; g.fillText(label, wx - tw / 2, wy + 23);
  };

  Camera.on('frame', () => {
    if (!Camera.video) return;
    const v = Camera.video;
    if (cv.width !== v.videoWidth && v.videoWidth) { cv.width = v.videoWidth; cv.height = v.videoHeight; }
    g.save(); g.scale(-1, 1); g.drawImage(v, -cv.width, 0, cv.width, cv.height); g.restore();
    if (Camera.fret) drawHand(Camera.fret, '#f5a524', 'fretting');
    if (Camera.strum) drawHand(Camera.strum, '#6fb6ff', 'strumming');
    const now = performance.now();
    if (now - lastCoach > 250) { lastCoach = now; coach.innerHTML = cameraCoach(); }
  });
}

function cameraCoach() {
  const line = (cls, ico, html) => `<div class="status ${cls}"><span class="s-ico">${ico}</span><span>${html}</span></div>`;
  const fret = Camera.seen('fret'), strum = Camera.seen('strum');
  const ctx = Camera.context;
  if (!fret && !strum) return line('warn', '👀', "I can't see your hands. Get both hands and the guitar neck in the picture, with light in front of you.");
  let out = '';
  if (!fret) out += line('warn', '✋', "I can't see your fretting hand. Turn the neck a little toward the camera.");
  if (ctx?.type === 'chord' && fret) {
    const used = [...new Set(ctx.chord.fingers.filter((f) => f > 0))];
    const states = used.map((f) => ({ f, st: Camera.fingerState(f) }));
    out += `<div class="fingers">${states.map(({ f, st }) => `<span class="chip ${st === 'flat' ? '' : st ? 'ok' : ''}" style="${st === 'flat' ? 'color:var(--bad);border-color:#6b2b24' : ''}">${cap(fingerName(f))} ${st === 'flat' ? 'flat ✗' : st ? '✓' : '?'}</span>`).join('')}</div>`;
    const flat = states.find((x) => x.st === 'flat');
    out += flat
      ? line('bad', '☝️', `Your <b>${fingerName(flat.f)}</b> finger looks flat. Curl it so the tip comes straight down, like a claw. Flat fingers mute the string below.`)
      : line('ok', '✓', 'Finger shape looks good. Thumb behind the neck, wrist relaxed.');
  } else if (ctx?.type === 'rhythm') {
    if (!strum) out += line('warn', '✋', "I can't see your strumming hand.");
    else {
      const m = Camera.strumMotion();
      if (m !== null && m < 0.015 && Mic.running && performance.now() - Mic.lastOnsetPerf < 3000) out += line('warn', '〰️', 'Keep your strumming hand moving like a pendulum, even on skipped beats.');
      const last = ctx.last;
      if (last?.got) out += line(last.got === last.want ? 'ok' : 'bad', last.got === 'D' ? '↓' : '↑', `Last strum: ${last.got === 'D' ? 'down' : 'up'}${last.got === last.want ? ' ✓' : `, should be ${last.want === 'D' ? 'down' : 'up'}`}`);
      else out += line('ok', '✓', 'Watching your strumming direction.');
    }
  } else {
    out += line('ok', '✓', `Tracking ${fret && strum ? 'both hands' : 'your hand'}.`);
  }
  return out;
}

// ---------- Header + navigation ----------
function Header() {
  const micPill = $('#micpill'), camPill = $('#campill');
  const paint = () => {
    micPill.classList.toggle('on', Mic.running);
    camPill.classList.toggle("on", Camera.active);
    $('.lbl', camPill).textContent = Camera.loading ? 'Loading…' : 'Camera';
  };
  micPill.onclick = async () => {
    if (Mic.running) Mic.stop();
    else if (!(await Mic.start(Store.data.settings.micId))) toast(esc(Mic.error), 5000);
  };
  camPill.onclick = async () => {
    if (Camera.active) Camera.stop();
    else if (!(await Camera.start(Store.data.settings.camId))) toast(esc(Camera.error), 6000);
  };
  Mic.on('state', paint);
  Camera.on('state', paint);
  Mic.on('level', (l) => ($('.meter i', micPill).style.width = Math.min(100, Math.sqrt(l) * 260) + '%'));
  paint();
}

let cleanupView = null;
function route() {
  cleanupView?.();
  cleanupView = null;
  Metro.stop();
  Camera.context = null;
  const main = $('#main');
  const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [name = '', ...args] = hash.split('/');
  const view = { '': 'home', lessons: 'lessons', lesson: 'lesson', chords: 'chords', chord: 'chord', drill: 'drill', rhythm: 'rhythm', songs: 'songs', song: 'song', riff: 'riff', tuner: 'tuner', settings: 'settings', calibrate: 'calibrate' }[name] || 'notFound';
  const tab = { home: '', lessons: 'lessons', lesson: 'lessons', chords: 'chords', chord: 'chords', drill: 'chords', rhythm: 'chords', songs: 'songs', song: 'songs', riff: 'songs', tuner: 'tuner', settings: 'settings', calibrate: 'settings' }[view];
  $$('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.tab === tab));
  main.innerHTML = '';
  cleanupView = Views[view](main, ...args) || null;
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => {
  Header();
  CameraPanel();
  route();
  if (!window.isSecureContext) toast('Open this page over https (or as a local file) so the microphone and camera can work.', 8000);
});

</script>
