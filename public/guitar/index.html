<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strum Coach</title>
<meta name="description" content="Learn guitar with a coach that listens to every string and watches your hands.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #14110f;
  --bg2: #1c1815;
  --card: #231e1a;
  --card2: #2b2520;
  --line: #3a322b;
  --text: #f4ede6;
  --muted: #b3a597;
  --dim: #7d7064;
  --accent: #f5a524;
  --accent2: #ffcb6b;
  --ok: #3ecf8e;
  --bad: #ff6b5b;
  --warn: #ffd166;
  --up: #6fb6ff;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #2a1f14 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}
a { color: var(--accent2); }
button { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 0.5em; }
h1 { font-size: 1.9rem; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 0.8em; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 0.87rem; }
.big { font-size: 1.25rem; }
.center { text-align: center; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 14px; }
.grow { flex: 1; }
.hidden { display: none !important; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: rgba(20, 17, 15, 0.88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--text); }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #e0661f); display: grid; place-items: center; font-size: 1.2rem; }
.nav { display: flex; gap: 4px; flex: 1; justify-content: center; }
.nav a {
  text-decoration: none; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 0.95rem;
}
.nav a:hover { color: var(--text); background: var(--card); }
.nav a.active { color: #1b1206; background: var(--accent); }
.pills { display: flex; gap: 8px; }
.pill {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--muted);
}
.pill:hover { border-color: var(--accent); }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.pill.on { color: var(--text); }
.pill.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.meter { width: 44px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad)); transition: width 60ms linear; }

/* ---------- Layout ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 140px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; }
.card.hero { background: linear-gradient(135deg, #3a2410, #231e1a 60%); border-color: #5a3a17; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 14px; }
.section-title h2 { margin: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--card2); color: var(--text);
  padding: 11px 18px; border-radius: 12px; cursor: pointer; font-weight: 700; text-decoration: none;
  transition: transform 0.06s, background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1206; }
.btn.primary:hover { background: var(--accent2); }
.btn.big { padding: 15px 26px; font-size: 1.1rem; border-radius: 14px; }
.btn.small { padding: 7px 12px; font-size: 0.88rem; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #6b2b24; color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 0 var(--line); }

/* ---------- Stats / progress ---------- */
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.stat b { display: block; font-size: 1.6rem; letter-spacing: -0.02em; }
.stat span { color: var(--muted); font-size: 0.86rem; }
.bar { height: 10px; background: var(--bg2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ff7a2f); border-radius: 6px; transition: width 0.4s; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.chip.ok { color: var(--ok); border-color: #1f5a41; }
.chip.accent { color: var(--accent2); border-color: #5a3a17; }
.stars { color: var(--accent); letter-spacing: 1px; }

/* ---------- Coach tips ---------- */
.tip { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
.tip .ico { font-size: 1.4rem; line-height: 1; }
.tip .grow p { margin: 0; }
.tip + .tip { margin-top: 10px; }

/* ---------- Lessons ---------- */
.module { margin-bottom: 28px; }
.module h2 { display: flex; gap: 10px; align-items: center; }
.module h2 .num { width: 30px; height: 30px; border-radius: 9px; background: var(--card2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 0.95rem; }
.lesson-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.lesson {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: var(--text);
}
.lesson:hover { border-color: var(--accent); }
.lesson .check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 0.9rem; }
.lesson.done .check { background: var(--ok); border-color: var(--ok); color: #06281a; font-weight: 900; }
.lesson.next { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 165, 36, 0.15); }
.lesson .t { font-weight: 700; }
.lesson .m { color: var(--dim); font-size: 0.82rem; }

.steps-dots { display: flex; gap: 6px; }
.steps-dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.steps-dots i.done { background: var(--ok); }
.steps-dots i.cur { background: var(--accent); }
.lesson-body { min-height: 360px; }
.lesson-body .prose p { font-size: 1.08rem; }
.lesson-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }

/* ---------- Chords ---------- */
.chord-card { text-align: center; cursor: pointer; padding: 16px 10px; text-decoration: none; color: var(--text); display: block; }
.chord-card:hover { border-color: var(--accent); }
.chord-card .name { font-weight: 800; font-size: 1.3rem; }
svg.diagram { display: block; margin: 0 auto; overflow: visible; }
.diagram-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.diagram-wrap .label { font-weight: 900; font-size: 2.2rem; letter-spacing: -0.03em; }
.diagram-wrap.next { opacity: 0.6; }
.diagram-wrap.next .label { font-size: 1.4rem; }

/* ---------- Exercise ---------- */
.ex { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 760px) { .ex { grid-template-columns: 1fr; } }
.prompt { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
.feedback {
  border-radius: 14px; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--line); min-height: 58px;
  font-size: 1.05rem; transition: background 0.2s, border-color 0.2s;
}
.feedback.ok { border-color: #1f5a41; background: #11261d; }
.feedback.bad { border-color: #6b2b24; background: #2a1512; }
.feedback.warn { border-color: #6b5a24; background: #29230f; }
.feedback > b:first-child { display: block; font-size: 1.1rem; margin-bottom: 2px; }
.listen { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 0.92rem; }
.listen .wave { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
.listen .wave i { width: 3px; background: var(--accent); border-radius: 2px; height: 20%; transition: height 80ms; }
.string-list { display: grid; gap: 6px; }
.string-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
.string-row.cur { border-color: var(--accent); }
.string-row.ok { border-color: #1f5a41; }
.string-row.bad { border-color: #6b2b24; }
.string-row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex: none; }
.string-row.ok .n { background: var(--ok); color: #06281a; }
.string-row.bad .n { background: var(--bad); color: #2a0703; }
.string-row.cur .n { background: var(--accent); color: #1b1206; }
.string-row .what { flex: 1; }
.string-row .res { font-size: 0.88rem; color: var(--muted); text-align: right; }
.counter { font-size: 4rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
.timer { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
.dots i.ok { background: var(--ok); }

/* ---------- Tuner ---------- */
.tuner { text-align: center; }
.tuner .note { font-size: 6rem; font-weight: 900; line-height: 1; letter-spacing: -0.04em; }
.tuner .cents { font-size: 1.1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge { position: relative; height: 70px; max-width: 520px; margin: 18px auto; }
.gauge .scale { position: absolute; left: 0; right: 0; top: 30px; height: 4px; background: linear-gradient(90deg, var(--bad), var(--warn) 35%, var(--ok) 45%, var(--ok) 55%, var(--warn) 65%, var(--bad)); border-radius: 2px; }
.gauge .zero { position: absolute; left: 50%; top: 10px; width: 2px; height: 44px; background: var(--text); opacity: 0.4; }
.gauge .needle { position: absolute; top: 4px; left: 50%; width: 6px; height: 56px; margin-left: -3px; border-radius: 3px; background: var(--accent); transition: left 90ms linear, background 0.2s; }
.gauge .needle.in { background: var(--ok); box-shadow: 0 0 14px var(--ok); }
.tune-strings { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tune-strings button { width: 64px; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); cursor: pointer; font-weight: 800; font-size: 1.15rem; }
.tune-strings button small { display: block; font-size: 0.7rem; color: var(--dim); font-weight: 600; }
.tune-strings button.cur { border-color: var(--accent); }
.tune-strings button.done { border-color: var(--ok); color: var(--ok); }

/* ---------- Rhythm ---------- */
.rgrid { display: grid; gap: 10px; }
.rbar { display: grid; gap: 5px; padding: 8px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); position: relative; }
.rbar .cname { position: absolute; top: -10px; left: 10px; font-size: 0.78rem; font-weight: 800; color: var(--accent2); background: var(--bg); padding: 0 6px; border-radius: 6px; }
.slot { height: 48px; border-radius: 8px; display: grid; place-items: center; background: var(--card2); font-size: 1.35rem; font-weight: 900; color: var(--muted); border: 2px solid transparent; }
.slot.rest { background: transparent; color: var(--dim); font-size: 1rem; }
.slot.up { color: var(--up); }
.slot.now { border-color: var(--accent); }
.slot.hit { background: #174a33; color: #d4ffe9; }
.slot.near { background: #4a3f17; color: #fff3cc; }
.slot.miss { background: #4a1d17; color: #ffd7d1; }
.slot.extra { background: #4a1d17; }
.slot .cnt { display: block; font-size: 0.62rem; font-weight: 700; color: var(--dim); line-height: 1; }
.beat-light { width: 22px; height: 22px; border-radius: 50%; background: var(--line); transition: background 60ms; }
.beat-light.on { background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.beat-light.accent.on { background: var(--ok); box-shadow: 0 0 14px var(--ok); }

/* ---------- Tab (riffs) ---------- */
.tab { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow-x: auto; padding: 10px 0; }
.tab .line { display: flex; align-items: center; height: 30px; position: relative; }
.tab .line::before { content: ""; position: absolute; left: 30px; right: 0; top: 50%; height: 1px; background: var(--line); }
.tab .sname { width: 30px; color: var(--dim); font-weight: 700; flex: none; }
.tab .cell { width: 42px; flex: none; text-align: center; position: relative; z-index: 1; }
.tab .cell b { display: inline-block; min-width: 28px; padding: 2px 4px; border-radius: 7px; background: var(--card2); border: 1px solid var(--line); font-weight: 800; }
.tab .cell.cur b { background: var(--accent); color: #1b1206; border-color: var(--accent); transform: scale(1.15); }
.tab .cell.ok b { background: var(--ok); color: #06281a; border-color: var(--ok); }
.tab .cell.bad b { background: var(--bad); color: #2a0703; border-color: var(--bad); }

/* ---------- Songs ---------- */
.song-card { display: block; text-decoration: none; color: var(--text); cursor: pointer; }
.song-card:hover { border-color: var(--accent); }
.song-card .title { font-weight: 800; font-size: 1.1rem; }
.song-card .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chart { display: grid; gap: 16px; }
.chart .sec h3 { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
.bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.barbox { display: flex; gap: 2px; border: 1px solid var(--line); background: var(--bg2); border-radius: 10px; padding: 8px 6px; min-height: 48px; }
.barbox .c { flex: 1; text-align: center; font-weight: 800; border-radius: 6px; padding: 4px 0; }
.barbox .c.now { background: var(--accent); color: #1b1206; }
.barbox .c.hit { color: var(--ok); }
.barbox .c.miss { color: var(--bad); }
.player { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
@media (max-width: 760px) { .player { grid-template-columns: 1fr; } }
.beats { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
.countdown { font-size: 5rem; font-weight: 900; text-align: center; color: var(--accent); }
input[type=range] { accent-color: var(--accent); width: 100%; }
select, input[type=text], input[type=number] {
  background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; max-width: 100%;
}
label.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
label.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.setting:last-child { border-bottom: 0; }
.setting .d { max-width: 560px; }

/* ---------- Camera panel ---------- */
.campanel {
  position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 340px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.campanel .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-weight: 700; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
.campanel canvas { display: block; width: 100%; background: #000; aspect-ratio: 4 / 3; }
.campanel .coach { padding: 10px 12px; font-size: 0.9rem; display: grid; gap: 6px; }
.campanel.min canvas, .campanel.min .coach { display: none; }
@media (min-width: 1000px) {
  body.cam-on main { max-width: 1470px; padding-right: 380px; }
  body.cam-on.cam-min main { max-width: 1100px; padding-right: 20px; }
}
.campanel .fingers { display: flex; gap: 6px; flex-wrap: wrap; }
.status { display: flex; gap: 8px; align-items: flex-start; }
.status .s-ico { flex: none; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }
.status.warn { color: var(--warn); }

/* ---------- Toast / modal ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); z-index: 50;
  background: var(--card2); border: 1px solid var(--line); padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow);
  opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; font-weight: 600;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40; display: grid; place-items: center; padding: 20px; }
.modal { max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; }
.celebrate { text-align: center; padding: 30px 10px; }
.celebrate .emoji { font-size: 4rem; }

@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  .nav { order: 3; width: 100%; overflow-x: auto; justify-content: flex-start; }
  .campanel { width: 240px; right: 10px; bottom: 10px; }
  main { padding: 18px 14px 140px; }
  .counter { font-size: 3rem; }
}

</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="logo">🎸</span>Strum Coach</a>
  <nav class="nav">
    <a href="#/" data-tab="">Home</a>
    <a href="#/lessons" data-tab="lessons">Lessons</a>
    <a href="#/chords" data-tab="chords">Chords</a>
    <a href="#/songs" data-tab="songs">Songs</a>
    <a href="#/tuner" data-tab="tuner">Tuner</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
  <div class="pills">
    <button class="pill" id="micpill" title="Microphone on/off"><span class="dot"></span>Mic<span class="meter"><i></i></span></button>
    <button class="pill" id="campill" title="Camera on/off"><span class="dot"></span><span class="lbl">Camera</span></button>
  </div>
</header>
<main id="main"></main>
<aside class="campanel hidden" id="campanel">
  <div class="head"><span>👀 Coach camera</span><span class="row" style="gap:4px"><button class="btn small ghost" data-swap title="Swap which hand is which">⇄</button><button class="btn small ghost" data-min title="Minimize">–</button><button class="btn small ghost" data-off title="Turn camera off">✕</button></span></div>
  <canvas width="640" height="480"></canvas>
  <div class="coach"></div>
</aside>
<div class="toast" id="toast"></div>
<script>
// Strum Coach — audio analysis ("the ears").
// Pure functions only: every function takes raw samples and returns numbers,
// so the whole thing can be tested in Node with synthesized guitar sounds.

const DSP = (() => {
  const STD_TUNING = [40, 45, 50, 55, 59, 64]; // MIDI, string 6 (low E) -> string 1 (high e)
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const ftom = (f) => 69 + 12 * Math.log2(f / 440);
  const noteName = (m) => NOTE_NAMES[((Math.round(m) % 12) + 12) % 12];
  const noteNameOct = (m) => noteName(m) + (Math.floor(Math.round(m) / 12) - 1);

  // ---------- FFT ----------
  const hannCache = new Map();
  function hann(n) {
    if (!hannCache.has(n)) {
      const w = new Float64Array(n);
      for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
      hannCache.set(n, w);
    }
    return hannCache.get(n);
  }

  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (-2 * Math.PI) / len;
      const half = len >> 1;
      for (let k = 0; k < half; k++) {
        const cr = Math.cos(ang * k), ci = Math.sin(ang * k);
        for (let i = k; i < n; i += len) {
          const b = i + half;
          const tr = re[b] * cr - im[b] * ci;
          const ti = re[b] * ci + im[b] * cr;
          re[b] = re[i] - tr; im[b] = im[i] - ti;
          re[i] += tr; im[i] += ti;
        }
      }
    }
  }

  // Magnitude spectrum (length n/2) of a Hann-windowed frame.
  function magSpectrum(samples) {
    const n = samples.length;
    const w = hann(n);
    const re = new Float64Array(n), im = new Float64Array(n);
    for (let i = 0; i < n; i++) re[i] = samples[i] * w[i];
    fft(re, im);
    const mag = new Float64Array(n >> 1);
    for (let i = 0; i < mag.length; i++) mag[i] = Math.hypot(re[i], im[i]) / n;
    return mag;
  }

  function rms(samples, start = 0, end = samples.length) {
    let s = 0;
    for (let i = start; i < end; i++) s += samples[i] * samples[i];
    return Math.sqrt(s / Math.max(1, end - start));
  }

  // ---------- Spectral peaks ----------
  // Local maxima above a local floor, with parabolic interpolation for accurate frequency.
  function peaks(mag, sr, n, fmin = 65, fmax = 1600) {
    const binHz = sr / n;
    const k0 = Math.max(2, Math.floor(fmin / binHz));
    const k1 = Math.min(mag.length - 3, Math.ceil(fmax / binHz));
    const out = [];
    let max = 0;
    for (let k = k0; k <= k1; k++) if (mag[k] > max) max = mag[k];
    if (max <= 0) return out;
    const floorWin = Math.max(4, Math.round(40 / binHz)); // ~±40 Hz neighbourhood
    for (let k = k0; k <= k1; k++) {
      const b = mag[k];
      if (!(b > mag[k - 1] && b >= mag[k + 1])) continue;
      if (b < max * 0.02) continue;
      let sum = 0, cnt = 0;
      for (let j = Math.max(1, k - floorWin); j <= Math.min(mag.length - 1, k + floorWin); j++) {
        if (Math.abs(j - k) <= 2) continue;
        sum += mag[j]; cnt++;
      }
      const floor = cnt ? sum / cnt : 0;
      if (b < floor * 2.5) continue;
      const a = mag[k - 1], g = mag[k + 1];
      const den = a - 2 * b + g;
      const p = den !== 0 ? (0.5 * (a - g)) / den : 0;
      const f = (k + p) * binHz;
      out.push({ f, midi: ftom(f), amp: b - floor });
    }
    return out;
  }

  // ---------- Chroma (which of the 12 notes are sounding) ----------
  function chromaFromPeaks(pk) {
    const c = new Float64Array(12);
    for (const p of pk) {
      const n = Math.round(p.midi);
      const dev = Math.abs(p.midi - n);
      if (dev > 0.4) continue;
      c[((n % 12) + 12) % 12] += Math.sqrt(p.amp) * (1 - dev);
    }
    return normalize(c);
  }

  function normalize(v) {
    let s = 0;
    for (let i = 0; i < v.length; i++) s += v[i] * v[i];
    s = Math.sqrt(s) || 1;
    for (let i = 0; i < v.length; i++) v[i] /= s;
    return v;
  }

  function cosine(a, b) {
    let s = 0;
    for (let i = 0; i < 12; i++) s += a[i] * b[i];
    return s;
  }

  const HARM_W = [1, 0.8, 0.6, 0.45, 0.35, 0.3, 0.25, 0.2];
  // Expected chroma for a set of sounding MIDI notes, including overtones.
  function templateFromMidis(midis) {
    const c = new Float64Array(12);
    for (const m of midis) {
      for (let h = 1; h <= HARM_W.length; h++) {
        if (mtof(m) * h > 1600) break;
        const pc = (((m + Math.round(12 * Math.log2(h))) % 12) + 12) % 12;
        c[pc] += Math.sqrt(HARM_W[h - 1]);
      }
    }
    return normalize(c);
  }

  function chordMidis(frets, tuning = STD_TUNING) {
    const out = [];
    frets.forEach((f, i) => { if (f >= 0) out.push(tuning[i] + f); });
    return out;
  }

  // Rank candidate chords ({id, frets}) against a chroma vector.
  function rankChords(chroma, chords) {
    return chords
      .map((c) => ({ id: c.id, score: cosine(chroma, c._tpl || (c._tpl = templateFromMidis(chordMidis(c.frets)))) }))
      .sort((a, b) => b.score - a.score);
  }

  // Figure out *which string* is the problem when a chord sounds wrong.
  // Each string is checked at the exact frequencies only it produces (its fundamental and
  // overtones that no other string in the chord shares). A string with no energy there is
  // muted; a should-be-silent string with energy there is ringing when it shouldn't.
  function diagnoseChord(an, frets, snrMissing = 8) {
    const { mag, sr, n } = an;
    const binHz = sr / n;
    const sounding = [];
    frets.forEach((f, i) => { if (f >= 0) sounding.push({ string: 6 - i, midi: STD_TUNING[i] + f }); });
    const harmonicsOf = (m) => [1, 2, 3, 4, 5].map((h) => mtof(m) * h).filter((f) => f < 1600);
    // Peak-to-floor ratio right at one frequency: ~1 = nothing there, big = a note is ringing.
    const snrAt = (f) => {
      const c = f / binHz, w = Math.max(1, Math.round(c * 0.012)); // ±~0.2 semitone
      let pkv = 0;
      for (let k = Math.round(c) - w; k <= Math.round(c) + w; k++) {
        // Only a real peak counts, not the slope of a neighbouring note.
        if ((mag[k] || 0) > pkv && mag[k] >= (mag[k - 1] || 0) && mag[k] >= (mag[k + 1] || 0)) pkv = mag[k];
      }
      const lo = Math.max(1, Math.round(c * 0.9)), hi = Math.round(c * 1.1);
      const around = [];
      for (let k = lo; k <= hi; k++) if (Math.abs(k - c) > w + 1) around.push(mag[k] || 0);
      around.sort((a, b) => a - b);
      const floor = around[Math.floor(around.length * 0.3)] || 1e-9;
      return pkv ? pkv / Math.max(floor, 1e-9) : 1;
    };
    const uniqueEvidence = (m, others) => {
      const otherH = others.flatMap((o) => [1, 2, 3, 4, 5, 6].map((h) => ftom(mtof(o) * h)));
      const mine = harmonicsOf(m).filter((f) => f > 125 && !otherH.some((o) => Math.abs(o - ftom(f)) < 0.6));
      // Need two separate overtones to judge: one alone can vanish depending on where you pick.
      if (mine.length < 2) return null;
      return Math.max(...mine.map(snrAt));
    };
    const ev = sounding.map((s) => ({ ...s, e: uniqueEvidence(s.midi, sounding.filter((o) => o !== s).map((o) => o.midi)) }));
    const issues = [];
    for (const x of ev) if (x.e !== null && x.e < snrMissing) issues.push({ type: 'missing', string: x.string, snr: x.e });
    frets.forEach((f, i) => {
      if (f >= 0) return;
      const e = uniqueEvidence(STD_TUNING[i], sounding.map((o) => o.midi));
      if (e !== null && e > 12) issues.push({ type: 'extra', string: 6 - i, snr: e });
    });
    issues.sort((a, b) => (a.type === 'missing' ? a.snr : 100 / a.snr) - (b.type === 'missing' ? b.snr : 100 / b.snr));
    return { issues, checked: ev.filter((x) => x.e !== null).map((x) => x.string), evidence: ev };
  }

  // Count distinct notes clearly present (to tell a strum from a single plucked string).
  function distinctNotes(chroma) {
    let n = 0;
    for (let i = 0; i < 12; i++) if (chroma[i] > 0.3) n++;
    return n;
  }

  // Full chord analysis of a frame of samples (use ~8192–16384 samples, starting just after the strum).
  // Pass `pre` (samples from just before the strum) to ignore whatever was still ringing
  // from the previous chord.
  function analyzeChord(samples, sr, pre = null) {
    const mag = magSpectrum(samples);
    if (pre && pre.length === samples.length) {
      const mp = magSpectrum(pre);
      for (let i = 0; i < mag.length; i++) mag[i] = Math.max(0, mag[i] - mp[i] * 0.9);
    }
    const pk = peaks(mag, sr, samples.length);
    const chroma = chromaFromPeaks(pk);
    return { chroma, peaks: pk, notes: distinctNotes(chroma), mag, sr, n: samples.length };
  }

  // ---------- Single-string check (was the right note played on this string?) ----------
  // post: samples after the pluck, pre: samples just before it (so strings still ringing
  // from earlier plucks are subtracted out). Returns the most likely fret on that string.
  function checkString(post, pre, sr, openMidi, maxFret = 12) {
    const n = post.length;
    const mPost = magSpectrum(post);
    const mPre = pre ? magSpectrum(pre) : null;
    const diff = new Float64Array(mPost.length);
    for (let i = 0; i < diff.length; i++) diff[i] = Math.max(0, mPost[i] - (mPre ? mPre[i] * 1.05 : 0));
    const pk = peaks(diff, sr, n, 60, 2500);
    let total = 0;
    for (const p of pk) total += p.amp;
    if (!pk.length || total <= 0) return { fret: null, confidence: 0, pitched: 0, energy: rms(post) };

    const scoreFor = (m) => {
      let s = 0;
      for (let h = 1; h <= 6; h++) {
        const target = ftom(mtof(m) * h);
        let bestAmp = 0, bestIdx = -1;
        pk.forEach((p, idx) => {
          if (Math.abs(p.midi - target) < 0.35 && p.amp > bestAmp) { bestAmp = p.amp; bestIdx = idx; }
        });
        if (bestIdx >= 0) s += Math.sqrt(HARM_W[h - 1]) * Math.sqrt(bestAmp);
      }
      // How much of the new sound is explained by this note's harmonic series.
      const f0 = mtof(m);
      let explained = 0;
      for (const p of pk) {
        const h = Math.round(p.f / f0);
        if (h >= 1 && Math.abs(ftom(p.f) - ftom(f0 * h)) < 0.35) explained += p.amp;
      }
      // Peaks halfway between harmonics mean the real note is an octave lower
      // (laptop mics barely pick up the low E's fundamental, so this matters).
      let sub = 0;
      for (let h = 1; h <= 3; h++) {
        const target = ftom(mtof(m) * (h + 0.5));
        for (const p of pk) if (Math.abs(p.midi - target) < 0.35) sub = Math.max(sub, Math.sqrt(p.amp));
      }
      return { s: s - sub * 1.2, explained };
    };

    let best = null, second = null;
    for (let fret = 0; fret <= maxFret; fret++) {
      const r = scoreFor(openMidi + fret);
      const cand = { fret, ...r };
      if (!best || cand.s > best.s) { second = best; best = cand; }
      else if (!second || cand.s > second.s) second = cand;
    }
    const pitched = best.explained / total; // how much of the new sound is a clean note
    const confidence = second && best.s > 0 ? 1 - second.s / best.s : 1;
    return { fret: best.fret, midi: openMidi + best.fret, confidence, pitched, energy: rms(post) };
  }

  // ---------- Pitch (tuner / single notes): YIN ----------
  function yin(buf, sr, fmin = 70, fmax = 1100, threshold = 0.12) {
    const maxTau = Math.min(Math.floor(sr / fmin), buf.length >> 1);
    const minTau = Math.max(2, Math.floor(sr / fmax));
    const W = buf.length - maxTau;
    const d = new Float64Array(maxTau + 1);
    for (let tau = 1; tau <= maxTau; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) {
        const x = buf[i] - buf[i + tau];
        s += x * x;
      }
      d[tau] = s;
    }
    const cmnd = new Float64Array(maxTau + 1);
    cmnd[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= maxTau; tau++) {
      run += d[tau];
      cmnd[tau] = run > 0 ? (d[tau] * tau) / run : 1;
    }
    let tau = -1;
    for (let t = minTau; t < maxTau; t++) {
      if (cmnd[t] < threshold) {
        while (t + 1 < maxTau && cmnd[t + 1] < cmnd[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) {
      let minV = Infinity;
      for (let t = minTau; t < maxTau; t++) if (cmnd[t] < minV) { minV = cmnd[t]; tau = t; }
      if (minV > 0.35) return null;
    }
    const a = cmnd[tau - 1] ?? cmnd[tau], b = cmnd[tau], c = cmnd[tau + 1] ?? cmnd[tau];
    const den = a - 2 * b + c;
    const shift = den !== 0 ? (0.5 * (a - c)) / den : 0;
    const f = sr / (tau + shift);
    return { freq: f, midi: ftom(f), clarity: 1 - b };
  }

  // ---------- Onsets (a string was plucked / strummed) ----------
  // Feed hops of 512 samples; returns true when a new attack starts.
  class OnsetDetector {
    constructor(sr) {
      this.sr = sr;
      this.n = 1024;
      this.prev = null;
      this.hist = [];
      this.lastOnset = -Infinity;
      this.hopIndex = 0;
      this.noise = 0.002;
      this.sensitivity = 1;
      this.frames = [];
      this.rmsWin = [];
    }
    // frame: last 1024 samples ending at this hop. Returns strength (>0) on onset, else 0.
    push(frame) {
      this.hopIndex++;
      const r = rms(frame);
      // Background noise: follows quiet moments down instantly, creeps up slowly (~15 s to
      // double), so continuous playing doesn't get mistaken for background noise.
      this.noise = Math.max(0.0003, Math.min(this.noise * 1.0005, r));
      const mag = magSpectrum(frame);
      const binHz = this.sr / this.n;
      const k0 = Math.floor(70 / binHz), k1 = Math.ceil(3000 / binHz);
      const lm = new Float64Array(k1 - k0 + 1);
      for (let k = k0; k <= k1; k++) lm[k - k0] = Math.log1p(1000 * mag[k]);
      // SuperFlux: compare with a frequency-max-filtered frame from 2 hops ago, so the
      // wobble of strings that are already ringing doesn't look like a new strum.
      this.frames.push(lm);
      if (this.frames.length > 3) this.frames.shift();
      let flux = 0;
      if (this.frames.length === 3) {
        const ref = this.frames[0];
        for (let i = 0; i < lm.length; i++) {
          const r = Math.max(ref[i], ref[i - 1] ?? 0, ref[i + 1] ?? 0);
          flux += Math.max(0, lm[i] - r);
        }
      }
      // Loudness jump versus ~50 ms ago also counts (helps soft upstrokes).
      this.rmsWin.push(r);
      if (this.rmsWin.length > 6) this.rmsWin.shift();
      const jump = this.rmsWin.length === 6 ? r / Math.max(1e-6, this.rmsWin[0]) : 1;
      const h = this.hist;
      const sorted = h.slice().sort((a, b) => a - b);
      const med = sorted.length ? sorted[sorted.length >> 1] : 0;
      h.push(flux);
      if (h.length > 24) h.shift();
      const thr = med * 1.4 + 4.5 / this.sensitivity;
      const gate = Math.max(0.003, this.noise * 4) / this.sensitivity;
      const minGapHops = Math.round((0.12 * this.sr) / 512);
      const hit = flux > thr || (jump > 1.7 && flux > thr * 0.5);
      if (hit && r > gate && this.hopIndex - this.lastOnset >= minGapHops) {
        this.lastOnset = this.hopIndex;
        return flux;
      }
      return 0;
    }
  }

  return {
    STD_TUNING, NOTE_NAMES, mtof, ftom, noteName, noteNameOct,
    fft, magSpectrum, rms, peaks, chromaFromPeaks, templateFromMidis, chordMidis,
    rankChords, diagnoseChord, analyzeChord, checkString, yin, cosine, distinctNotes, OnsetDetector,
  };
})();

// Parse "G D:2 C:2" into [{chord, beats}]
function parseProg(prog, beatsPerBar) {
  return prog.trim().split(/\s+/).map((tok) => {
    const [c, b] = tok.split(':');
    return { chord: c, beats: b ? Number(b) : beatsPerBar };
  });
}

function songTimeline(song) {
  const segs = [];
  let beat = 0;
  for (const sec of song.sections) {
    for (let r = 0; r < (sec.repeat || 1); r++) {
      for (const p of parseProg(sec.prog, song.beats)) {
        segs.push({ ...p, start: beat, section: sec.name });
        beat += p.beats;
      }
    }
  }
  return { segs, totalBeats: beat };
}

function songChords(song) {
  const set = new Set();
  song.sections.forEach((s) => parseProg(s.prog, song.beats).forEach((p) => set.add(p.chord)));
  return [...set];
}

const Store = (() => {
  const KEY = 'strumcoach.v1';
  const blank = () => ({
    v: 1,
    lessons: {},
    chords: {},
    changes: {},
    songs: {},
    riffs: {},
    rhythm: {},
    practice: {},
    tunedOn: null,
    settings: { lefty: false, swapHands: false, latency: 0.04, sensitivity: 1, clickVol: 0.6, micId: '', camId: '' },
  });
  let data;
  try {
    data = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}'));
    data.settings = Object.assign(blank().settings, data.settings);
  } catch {
    data = blank();
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const today = () => new Date().toLocaleDateString('en-CA');
  return {
    get data() { return data; },
    save,
    today,
    set(fn) { fn(data); save(); },
    chord(id) { return (data.chords[id] ||= { tries: 0, clean: 0, issues: {}, strings: 0 }); },
    addPractice(secs) {
      const d = today();
      data.practice[d] = (data.practice[d] || 0) + secs;
      save();
    },
    practiceToday() { return data.practice[today()] || 0; },
    streak() {
      let n = 0;
      const d = new Date();
      if (!(data.practice[d.toLocaleDateString('en-CA')] >= 60)) d.setDate(d.getDate() - 1);
      while ((data.practice[d.toLocaleDateString('en-CA')] || 0) >= 60) { n++; d.setDate(d.getDate() - 1); }
      return n;
    },
    reset() { data = blank(); save(); },
    import(json) {
      const parsed = JSON.parse(json);
      if (!parsed || parsed.v !== 1) throw new Error('Not a Strum Coach backup file');
      data = Object.assign(blank(), parsed);
      data.settings = Object.assign(blank().settings, parsed.settings);
      save();
    },
  };
})();

// ---------- Tiny event helper ----------
function Emitter() {
  const map = {};
  return {
    on(evt, fn) { (map[evt] ||= new Set()).add(fn); return () => map[evt].delete(fn); },
    emit(evt, arg) { map[evt]?.forEach((fn) => { try { fn(arg); } catch (e) { console.error(e); } }); },
  };
}

// ---------- Microphone ----------
const Mic = (() => {
  const ev = Emitter();
  const BUF = 2048;
  const self = {
    ...ev,
    ctx: null, stream: null, running: false, sr: 48000,
    ring: null, size: 0, total: 0, hopEnd: 1024, t0: 0,
    det: null, level: 0, lastOnsetPerf: 0, waits: [], error: null,

    ensureCtx() {
      if (!self.ctx) self.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      if (self.ctx.state === 'suspended') self.ctx.resume();
      return self.ctx;
    },

    async start(deviceId) {
      if (self.running) return true;
      self.error = null;
      try {
        const ctx = self.ensureCtx();
        const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
        if (deviceId) audio.deviceId = { exact: deviceId };
        self.stream = await navigator.mediaDevices.getUserMedia({ audio });
        self.sr = ctx.sampleRate;
        self.size = Math.round(self.sr * 6);
        self.ring = new Float32Array(self.size);
        self.total = 0;
        self.hopEnd = 1024;
        self.det = new DSP.OnsetDetector(self.sr);
        self.det.sensitivity = Store.data.settings.sensitivity;
        self.src = ctx.createMediaStreamSource(self.stream);
        self.proc = ctx.createScriptProcessor(BUF, 1, 1);
        const mute = ctx.createGain();
        mute.gain.value = 0;
        self.src.connect(self.proc);
        self.proc.connect(mute).connect(ctx.destination);
        self.proc.onaudioprocess = (e) => self._chunk(e.inputBuffer.getChannelData(0), e.playbackTime);
        self.running = true;
        ev.emit('state', true);
        return true;
      } catch (e) {
        self.error = e.name === 'NotAllowedError'
          ? 'Microphone permission was blocked. Click the lock/camera icon in the address bar and allow the microphone, then try again.'
          : e.name === 'NotFoundError' ? 'No microphone found. Plug one in or check your system sound settings.' : String(e.message || e);
        ev.emit('state', false);
        return false;
      }
    },

    stop() {
      if (!self.running) return;
      self.proc.disconnect();
      self.src.disconnect();
      self.stream.getTracks().forEach((t) => t.stop());
      self.running = false;
      ev.emit('state', false);
    },

    _chunk(data, playbackTime) {
      if (self.total === 0) {
        // Input samples arrive roughly one buffer before their output slot.
        self.t0 = playbackTime - (2 * BUF) / self.sr;
      }
      for (let i = 0; i < data.length; i++) self.ring[(self.total + i) % self.size] = data[i];
      self.total += data.length;
      self.level = DSP.rms(data);
      while (self.hopEnd <= self.total) {
        const frame = self.read(self.hopEnd - 1024, 1024);
        const strength = self.det.push(frame);
        if (strength) {
          const abs = self.hopEnd - 768;
          self.lastOnsetPerf = performance.now();
          ev.emit('onset', { abs, time: self.timeOf(abs), strength });
        }
        self.hopEnd += 512;
      }
      if (self.waits.length) {
        const due = self.waits.filter((w) => w.at <= self.total);
        self.waits = self.waits.filter((w) => w.at > self.total);
        due.forEach((w) => w.fn());
      }
      ev.emit('level', self.level);
    },

    read(absStart, len) {
      const out = new Float32Array(len);
      const oldest = self.total - self.size;
      for (let i = 0; i < len; i++) {
        const a = absStart + i;
        out[i] = a < 0 || a < oldest || a >= self.total ? 0 : self.ring[a % self.size];
      }
      return out;
    },
    latest(len) { return self.read(self.total - len, len); },
    timeOf(abs) { return self.t0 + abs / self.sr; },
    // Resolve with `len` samples starting `delay` seconds after an onset, once they've arrived.
    capture(abs, delay, len) {
      const start = abs + Math.round(delay * self.sr);
      return new Promise((res) => self.waits.push({ at: start + len, fn: () => res(self.read(start, len)) }));
    },
    setSensitivity(v) { if (self.det) self.det.sensitivity = v; },
  };
  return self;
})();

// ---------- Metronome ----------
const Metro = (() => {
  let timer = null, next = 0, beat = 0, opts = null;
  const timeouts = [];
  function click(time, accent) {
    const ctx = Mic.ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    // High-pitched click, well above the guitar range the strum detector listens to.
    o.frequency.value = accent ? 5200 : 4400;
    const vol = Store.data.settings.clickVol;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol * (accent ? 0.5 : 0.32), time + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    o.connect(g).connect(ctx.destination);
    o.start(time);
    o.stop(time + 0.06);
  }
  function tick() {
    const ctx = Mic.ctx;
    while (next < ctx.currentTime + 0.15) {
      const b = beat;
      if (!opts.silent) click(next, b % opts.beatsPerBar === 0);
      const delay = Math.max(0, (next - ctx.currentTime) * 1000);
      const t = next;
      timeouts.push(setTimeout(() => opts.onBeat?.(b, t), delay));
      next += 60 / opts.bpm;
      beat++;
      if (opts.totalBeats && beat >= opts.totalBeats) {
        const endAt = next;
        timeouts.push(setTimeout(() => { stop(); opts.onEnd?.(endAt); }, Math.max(0, (endAt - ctx.currentTime) * 1000)));
        clearInterval(timer);
        timer = null;
        return;
      }
    }
  }
  function start(o) {
    stop();
    const ctx = Mic.ensureCtx();
    opts = o;
    beat = 0;
    next = ctx.currentTime + 0.25;
    o.onStart?.(next);
    timer = setInterval(tick, 25);
    tick();
    return next;
  }
  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    timeouts.splice(0).forEach(clearTimeout);
  }
  return { start, stop, get running() { return !!timer; } };
})();

// ---------- Camera + hand tracking ----------
const Camera = (() => {
  const ev = Emitter();
  const MP_VER = '0.10.14';
  const self = {
    ...ev,
    active: false, loading: false, error: null, video: null, stream: null, landmarker: null,
    fret: null, strum: null, trail: [], hist: { fret: [], strum: [] }, context: null, lastSeen: { fret: 0, strum: 0 },
    arch: {},

    async start(deviceId) {
      if (self.active || self.loading) return true;
      self.loading = true;
      self.error = null;
      ev.emit('state');
      try {
        const video = { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' };
        if (deviceId) video.deviceId = { exact: deviceId };
        self.stream = await navigator.mediaDevices.getUserMedia({ video });
        self.video = document.createElement('video');
        self.video.muted = true;
        self.video.playsInline = true;
        self.video.srcObject = self.stream;
        await self.video.play();
        if (!self.landmarker) {
          const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
          const files = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
          const opts = (delegate) => ({
            baseOptions: {
              modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
              delegate,
            },
            runningMode: 'VIDEO', numHands: 2,
            minHandDetectionConfidence: 0.65, minHandPresenceConfidence: 0.65, minTrackingConfidence: 0.5,
          });
          try { self.landmarker = await vision.HandLandmarker.createFromOptions(files, opts('GPU')); }
          catch { self.landmarker = await vision.HandLandmarker.createFromOptions(files, opts('CPU')); }
        }
        self.active = true;
        self.loading = false;
        ev.emit('state');
        self._loop();
        return true;
      } catch (e) {
        self.loading = false;
        self.stream?.getTracks().forEach((t) => t.stop());
        self.error = e.name === 'NotAllowedError'
          ? 'Camera permission was blocked. Allow the camera in the address bar and try again.'
          : e.name === 'NotFoundError' ? 'No camera found.'
          : 'Could not start hand tracking (needs an internet connection the first time). ' + (e.message || e);
        ev.emit('state');
        return false;
      }
    },

    stop() {
      self.active = false;
      self.stream?.getTracks().forEach((t) => t.stop());
      self.fret = self.strum = null;
      ev.emit('state');
    },

    _loop() {
      let lastT = -1, lastRun = 0;
      const step = () => {
        if (!self.active) return;
        const now = performance.now();
        if (self.video.currentTime !== lastT && now - lastRun > 40) {
          lastT = self.video.currentTime;
          lastRun = now;
          try {
            const res = self.landmarker.detectForVideo(self.video, now);
            self._process(res, now);
          } catch (e) { console.warn(e); }
        }
        ev.emit('frame');
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },

    _process(res, now) {
      const s = Store.data.settings;
      // MediaPipe labels hands as if the image were mirrored; a raw webcam frame isn't,
      // so its "Left" is the player's right hand.
      let strumLabel = s.lefty ? 'Right' : 'Left';
      if (s.swapHands) strumLabel = strumLabel === 'Left' ? 'Right' : 'Left';
      let fret = null, strum = null;
      (res.landmarks || []).forEach((lm, i) => {
        const cat = res.handednesses?.[i]?.[0] || res.handedness?.[i]?.[0];
        const world = res.worldLandmarks?.[i];
        // Webcams sometimes see a mouth or face as a hand. Real hands get a confident
        // label and have hand-sized proportions.
        if (!cat || cat.score < 0.8 || !self._handShaped(world)) return;
        const hand = { lm, world, score: cat.score };
        if (cat.categoryName === strumLabel) { if (!strum || hand.score > strum.score) strum = hand; }
        else if (!fret || hand.score > fret.score) fret = hand;
      });
      // Only trust a hand after it has shown up in most recent frames (false hits flicker).
      self.hist.fret = [...self.hist.fret, !!fret].slice(-8);
      self.hist.strum = [...self.hist.strum, !!strum].slice(-8);
      const steady = (h) => h.filter(Boolean).length >= 5;
      if (!steady(self.hist.fret)) fret = null;
      if (!steady(self.hist.strum)) strum = null;
      self.fret = fret;
      self.strum = strum;
      if (fret) { self.lastSeen.fret = now; self._arch(fret); }
      if (strum) {
        self.lastSeen.strum = now;
        const y = (strum.lm[0].y + strum.lm[9].y) / 2;
        self.trail.push({ t: now, y });
      }
      while (self.trail.length && self.trail[0].t < now - 3000) self.trail.shift();
    },

    // Palm and finger lengths (in metres, from 3D landmarks) must look like a real hand.
    _handShaped(w) {
      if (!w) return true;
      const d = (a, b) => Math.hypot(w[a].x - w[b].x, w[a].y - w[b].y, w[a].z - w[b].z);
      const palm = d(0, 9), width = d(5, 17), index = d(5, 6) + d(6, 7) + d(7, 8);
      return palm > 0.05 && palm < 0.14 && width > 0.035 && width < 0.12 && index > 0.035 && index < 0.13;
    },

    // How curled each fretting finger is (from 3D joint angles). Flat fingers mute strings.
    _arch(hand) {
      const w = hand.world || hand.lm;
      const v = (a, b) => [w[b].x - w[a].x, w[b].y - w[a].y, w[b].z - w[a].z];
      const ang = (p, q) => {
        const d = p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
        const m = Math.hypot(...p) * Math.hypot(...q) || 1;
        return (Math.acos(Math.max(-1, Math.min(1, d / m))) * 180) / Math.PI;
      };
      const F = { 1: [5, 6, 7, 8], 2: [9, 10, 11, 12], 3: [13, 14, 15, 16], 4: [17, 18, 19, 20] };
      for (const [f, [a, b, c, d]] of Object.entries(F)) {
        const bend = ang(v(a, b), v(b, c)) + ang(v(b, c), v(c, d));
        const prev = self.arch[f] ?? bend;
        self.arch[f] = prev * 0.7 + bend * 0.3;
      }
    },

    seen(which, withinMs = 700) { return performance.now() - self.lastSeen[which] < withinMs; },

    fingerState(f) {
      const b = self.arch[f];
      if (b == null) return null;
      return b >= 55 ? 'curled' : b < 35 ? 'flat' : 'ok';
    },

    // Which way was the strumming hand moving when a strum was heard? ('D', 'U' or null)
    directionAt(audioTime) {
      if (!self.active || !self.seen('strum', 500) || !Mic.ctx) return null;
      const perf = performance.now() + (audioTime - Mic.ctx.currentTime) * 1000;
      const pts = self.trail.filter((p) => p.t >= perf - 140 && p.t <= perf + 60);
      if (pts.length < 2) return null;
      const dy = pts[pts.length - 1].y - pts[0].y;
      if (Math.abs(dy) < 0.012) return null;
      return dy > 0 ? 'D' : 'U';
    },

    // Is the strumming hand still moving (pendulum), or has it stopped?
    strumMotion() {
      const now = performance.now();
      const pts = self.trail.filter((p) => p.t > now - 700);
      if (pts.length < 4) return null;
      const ys = pts.map((p) => p.y);
      return Math.max(...ys) - Math.min(...ys);
    },
  };
  return self;
})();

// Practice-time tracker: counts time while you're actually playing.

// Strum Coach — exercises. Each one renders into `root` and returns a cleanup function.

// ---------- Small helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const fingerName = (f) => FINGER_NAMES[f] || 'a';
const stringLabel = (s) => `string ${s} (${STRING_NAMES[s]})`;
const openMidi = (s) => DSP.STD_TUNING[6 - s];

function toast(msg, ms = 2200) {
  let t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), ms);
}

function chordSVG(chord, { w = 180, status = {}, fingers = true } = {}) {
  const lefty = Store.data.settings.lefty;
  const played = chord.frets.filter((f) => f > 0);
  const maxF = Math.max(3, ...played);
  const minF = played.length ? Math.min(...played) : 1;
  const base = maxF > 4 ? minF : 1;
  const rows = Math.max(4, maxF - base + 1);
  const pad = w * 0.14, top = w * 0.2, sp = (w - pad * 2) / 5, fh = sp * 1.2;
  const h = top + rows * fh + w * 0.06;
  const X = (i) => pad + (lefty ? 5 - i : i) * sp;
  const col = (s) => ({ ok: 'var(--ok)', bad: 'var(--bad)', cur: 'var(--accent)' })[status[s]];
  let g = '';
  for (let r = 0; r <= rows; r++) {
    const y = top + r * fh;
    const nut = r === 0 && base === 1;
    g += `<line x1="${pad}" x2="${w - pad}" y1="${y}" y2="${y}" style="stroke:${nut ? 'var(--text)' : 'var(--line)'};stroke-width:${nut ? w * 0.03 : 2}" />`;
  }
  if (base > 1) g += `<text x="${pad - 8}" y="${top + fh * 0.62}" text-anchor="end" style="fill:var(--muted);font-size:${w * 0.09}px;font-weight:700">${base}fr</text>`;
  chord.frets.forEach((f, i) => {
    const s = 6 - i, x = X(i), c = col(s);
    g += `<line x1="${x}" x2="${x}" y1="${top}" y2="${top + rows * fh}" style="stroke:${c || 'var(--muted)'};stroke-width:${c ? 3.5 : 1 + (5 - i) * 0.35}" />`;
    const my = top - w * 0.08;
    if (f < 0) g += `<text x="${x}" y="${my + w * 0.035}" text-anchor="middle" style="fill:${c || 'var(--dim)'};font-size:${w * 0.1}px;font-weight:800">×</text>`;
    else if (f === 0) g += `<circle cx="${x}" cy="${my}" r="${w * 0.035}" style="fill:${c || 'none'};stroke:${c || 'var(--muted)'};stroke-width:2" />`;
    else {
      const y = top + (f - base + 0.5) * fh;
      g += `<circle cx="${x}" cy="${y}" r="${sp * 0.38}" style="fill:${c || 'var(--accent)'}" />`;
      if (fingers && chord.fingers?.[i]) g += `<text x="${x}" y="${y + sp * 0.14}" text-anchor="middle" style="fill:#1b1206;font-size:${sp * 0.42}px;font-weight:900">${chord.fingers[i]}</text>`;
    }
  });
  return `<svg class="diagram" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(chord.name || chord.id)} chord diagram">${g}</svg>`;
}

function diagramBlock(chord, opts = {}) {
  return `<div class="diagram-wrap ${opts.next ? 'next' : ''}"><div class="label">${esc(chord.id)}</div>${chordSVG(chord, opts)}${opts.caption ? `<div class="small muted">${opts.caption}</div>` : ''}</div>`;
}

// 6-line tab (high e on top). statuses: per note index 'ok' | 'bad'
function tabHTML(notes, cur = -1, statuses = {}) {
  let html = '<div class="tab">';
  for (let s = 1; s <= 6; s++) {
    html += `<div class="line"><span class="sname">${['e', 'B', 'G', 'D', 'A', 'E'][s - 1]}</span>`;
    notes.forEach((n, i) => {
      const cls = i === cur ? 'cur' : statuses[i] || '';
      html += `<span class="cell ${n.s === s ? cls : ''}">${n.s === s ? `<b>${n.f}</b>` : ''}</span>`;
    });
    html += '</div>';
  }
  return html + '</div>';
}

// ---------- Judging what was heard ----------
// Samples from just before a strum, so the previous chord's ringing can be subtracted.
const preOnset = (o, len) => Mic.read(o.abs - len - Math.round(0.015 * Mic.sr), len);

function judgeChord(samples, expectedId, poolIds, { strict = true, pre = null } = {}) {
  if (DSP.rms(samples) < 0.002) return { quiet: true };
  const an = DSP.analyzeChord(samples, Mic.sr, pre);
  const pool = judgePool(expectedId, [...new Set([expectedId, ...poolIds])]).map((id) => CHORD[id]);
  const ranked = DSP.rankChords(an.chroma, pool);
  const mine = ranked.find((r) => r.id === expectedId);
  const top = ranked[0];
  const ok = mine.score >= (strict ? 0.8 : 0.74) && mine.score >= top.score - (strict ? 0.02 : 0.04);
  const diag = DSP.diagnoseChord(an, CHORD[expectedId].frets);
  return { ok, clean: ok && !diag.issues.length, score: mine.score, heard: top.id, issues: diag.issues, notes: an.notes };
}

function firstString(chord) { return 6 - chord.frets.findIndex((f) => f >= 0); }

function mutedAdvice(chord, s) {
  const i = 6 - s, f = chord.frets[i], fg = chord.fingers?.[i];
  if (f > 0) return `Press your ${fingerName(fg)} finger down on its very tip, right behind fret ${f}. If it still thuds, another finger is touching this string.`;
  const nb = [s + 1, s - 1].filter((n) => n >= 1 && n <= 6).map((n) => ({ n, fg: chord.fingers?.[6 - n] })).find((x) => x.fg > 0);
  if (nb) return `It's an open string, so something is leaning on it. Probably your ${fingerName(nb.fg)} finger on string ${nb.n}: curl it so it comes straight down on its tip, like a claw.`;
  return "It's an open string, so nothing should touch it. Check that your palm or a finger isn't resting on it.";
}

function issueText(chord, issue) {
  if (issue.type === 'missing') return `<b>${cap(stringLabel(issue.string))} isn't ringing.</b> ${mutedAdvice(chord, issue.string)}`;
  const fs = firstString(chord);
  return `<b>Don't play string ${issue.string} (${STRING_NAMES[issue.string]}) on ${chord.id}.</b> Start your strum from ${stringLabel(fs)}.`;
}

function chordFeedback(chord, j) {
  if (j.quiet) return { cls: 'warn', html: '<b>Too quiet.</b> Strum a bit harder or move closer to the computer.' };
  if (j.clean) return { cls: 'ok', html: `<b>Clean ${esc(chord.id)}! ✓</b> Every string I can check rang out.` };
  if (j.issues.length) return { cls: 'bad', html: issueText(chord, j.issues[0]) };
  if (j.notes <= 1) return { cls: 'warn', html: '<b>That sounded like a single string.</b> Strum across all the strings in one smooth motion.' };
  if (j.heard !== chord.id && j.score < 0.8) return { cls: 'bad', html: `<b>That sounded more like ${esc(j.heard)}.</b> Compare each finger with the diagram: right string, right fret?` };
  return { cls: 'bad', html: "<b>Not quite clean.</b> Something's off. Try the string-by-string check to find exactly which string." };
}

// Verdict for a single plucked string (string check, riffs).
function noteVerdict(s, expectedFret, r, chord) {
  const expMidi = openMidi(s) + expectedFret;
  if (r.energy < 0.0015) return { ok: false, cls: 'warn', html: `<b>Too quiet.</b> Pluck ${stringLabel(s)} a bit harder.` };
  if (r.fret === null || r.pitched < 0.3) {
    return { ok: false, cls: 'bad', html: `<b>${cap(stringLabel(s))} sounds muted.</b> ` + (chord ? mutedAdvice(chord, s) : 'Press firmly on your fingertip, right behind the fret wire.') };
  }
  if (r.fret === expectedFret) {
    return { ok: true, cls: 'ok', html: `<b>Clean ${DSP.noteName(expMidi)}! ✓</b>` + (r.pitched < 0.5 ? ' Slightly buzzy: press a little closer to the fret wire.' : '') };
  }
  const fg = chord?.fingers?.[6 - s];
  if (expectedFret > 0 && r.fret === 0) {
    return { ok: false, cls: 'bad', html: `<b>That's the open string.</b> Your finger isn't holding it down. ${fg ? `Put your ${fingerName(fg)} finger` : 'Press'} on fret ${expectedFret}, right behind the fret wire.` };
  }
  const diff = r.fret - expectedFret;
  if (Math.abs(diff) <= 2) {
    return { ok: false, cls: 'bad', html: `<b>You're on fret ${r.fret}. It should be fret ${expectedFret}.</b> Move ${plural(Math.abs(diff), 'fret')} toward the ${diff > 0 ? 'headstock (away from the body)' : 'guitar body'}.` };
  }
  return { ok: false, cls: 'bad', html: `<b>I heard ${DSP.noteName(r.midi)}, but wanted ${DSP.noteName(expMidi)}.</b> Make sure you're plucking ${stringLabel(s)}, ${expectedFret ? `fretted at fret ${expectedFret}` : 'open (no finger)'}.` };
}

function listenBadge() {

}
function animateListen(root) {

// Wraps an exercise so it first asks for the microphone if needed.
function needMic(root, start) {
  let inner = null;
  const go = () => { root.innerHTML = ''; inner = start(); };
  if (Mic.running) { go(); return () => inner?.(); }
  root.innerHTML = `<div class="card flat center stack">
    <div style="font-size:3rem">🎤</div>
    <h2>I need to hear you</h2>

    <div><button class="btn primary big" data-go>Turn on microphone</button></div>

function MicSetup(root, { onPass }) {
